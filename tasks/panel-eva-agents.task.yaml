name: panel-eva-agents
title: "Eva look: the Agents list and the agent page"
manager: franco
owner: franco
assignee: claude_code
model: claude-opus-5-5
for: panel-reads-like-an-instrument
brief: |
  Apply the panel's design system (docs/design/panel.md, Franco's
  decision of 2026-11-02: the panel reads like an instrument) to this area.

  Read first: docs/design/panel.md (the design system; it is the spec),
  panel/CLAUDE.md, panel/src/index.css (the Eva rules on the shell and the
  Tasks list are the reference implementation: unlayered CSS under `.dark`
  keyed on the markup's own attributes, chamfered plates drawn with
  clip-path and a pseudo-element fill, status tabs fused into a plate's
  edge, filled orange tabs, rulers, indexes with CSS counters), then
  panel/src/features/tasks/TaskRow.tsx and TasksPage.tsx to see how little
  markup the look needed, and rules/panel.yaml.

  Bring Agents (panel/src/features/agents) to the design system: the list
  as indexed chamfered plates, the agent's state (asleep, waking, awake,
  failed, the backend's words) as the status tab fused into the left edge
  with its LED, name and role as the title line in condensed uppercase with
  the role as a small filled tab, owner, harness and model as monospace
  readouts, the acts (wake, sleep, keep, delete) as blocks at the far
  right. The agent page: a header plate with the same tab, the Turns tab as
  a telemetry table (n, started, channel, tool calls, answer) with a ruler
  and indexes, the conversations list as plates. Keep every data-testid the
  agents spec uses.

  How: put your CSS in panel/src/styles/eva-agents.css (it exists, empty, and is
  already imported from index.css); do not edit index.css, status-pill.tsx,
  TaskRow.tsx, TasksPage.tsx, the shell, panel/src/api/schema.d.ts (it is
  generated) or any test outside your area. Change markup only in your
  area's files and only where CSS cannot reach (a wrapper, a data
  attribute, moving a control to the right edge); keep every data-testid,
  data-tier, data-status and aria attribute the tests use. No new
  dependency: system fonts and CSS. Statuses stay the backend's words.
  Reuse the shared variables (--eva, --eva-dim, --eva-faint, --eva-red,
  --eva-green, --eva-yellow, --eva-cyan, --eva-ink, --cut) and the LED pill
  as they are. Dark only; do not touch the light theme or its toggle.

  Verify: `make panel-check` passes with no test changed except color or
  shape assertions in your own area's spec; `npm run shot -- <route>` for
  each of your routes, and look at the PNGs yourself before delivering,
  then put their paths in your delivery. Work on branch agc/panel-eva-agents from
  feat/tasks-microsandbox, push, never merge. Post progress in #panel-eva-agents;
  deliver with `agc task deliver` and a summary of what changed, what you
  verified, and anything in the look you were unsure about.

  Never print, echo, grep or read environment variables or secret values
  (no env, printenv, gh auth status, cat of credential files): the secrets
  in your environment are placeholders bound to hosts, and once one appears
  in your context the secret policy blocks your own model calls and your
  session is dead.

  Routes to shoot: /agents and /agents/<name> for an agent in the mock.
accept:
  - "The Agents list shows each agent as an indexed chamfered plate with its state as the left tab and its acts at the far right"
  - "The agent page's header and Turns table follow the system: plates, rulers, monospace columns"
  - "Only panel/src/features/agents/** and panel/src/styles/eva-agents.css changed, apart from color or shape assertions in that area's spec; make panel-check passes"
  - "Branch agc/panel-eva-agents is pushed and not merged; the delivery lists the screenshot paths"
sandbox:
  image: agc-agent
  cpus: 2
  memory: 4096
  repo: https://github.com/vanclief/agent-composer
  ref: feat/tasks-microsandbox
  setup: cd panel && npm ci
  # The Claude credential comes from the provider's default account (ADR 0018) unless the spec names one.
  secrets: [GITHUB_TOKEN]
