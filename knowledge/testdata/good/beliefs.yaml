beliefs:
  - id: observed-a
    belief: A was seen.
    evidence: [seen-a]
  - id: observed-b
    belief: B was seen.
    evidence: [seen-b]
  - id: derived
    belief: C follows from A and B.
    because: [observed-a, observed-b]
  - id: top
    belief: D follows from C.
    because: [derived]
  - id: unrelated
    belief: E stands alone.
    evidence: [seen-e-first, seen-e-again]
  - id: hunch
    belief: F is true, though nobody saw it.
  - id: retracted-only
    belief: G is there.
    evidence: [seen-g]
  - id: mixed
    belief: H follows from F and G.
    because: [hunch, retracted-only]
