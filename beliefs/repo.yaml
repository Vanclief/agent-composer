# What we hold true about agent-composer and where it runs. A belief rests
# on other beliefs (because), cites evidence by id (evidence/), both or
# neither. One with no evidence under it is an opinion, and
# `agc beliefs show` says so. When reality disagrees, the belief is wrong:
# fix it here, then run `agc beliefs doubt <id>` to see what rests on it
# (ADR 0006).
beliefs:
  # Go and agents
  - id: go-has-one-formatting
    belief: Go has one canonical format, enforced by gofmt.
    evidence: [gofmt-is-the-only-go-formatter]
  - id: go-syntax-is-small
    belief: Go's syntax is small, so there are few ways to write the same thing.
    evidence: [go-spec-has-a-small-syntax]
  - id: agents-write-go-well
    belief: Go is better than Rust in general for writing code with agents.
    because: [go-has-one-formatting, go-syntax-is-small]
  - id: strict-style-makes-agent-output-reviewable
    belief: A strict, uniform Go style makes code written by agents quick to review.
    because: [agents-write-go-well]

  # Storage
  - id: sqlite-is-enough-for-a-local-tool
    belief: A local SQLite file is enough storage for agc; it needs no external services.
    evidence: [agc-stores-everything-in-local-sqlite]

  # The rig
  - id: rig-is-only-kvm-host
    belief: The rig at 192.168.0.45 is the only machine we have with KVM.
    evidence: [rig-is-the-only-machine-with-kvm]
  - id: rig-is-on-home-lan-without-firewall
    belief: The rig sits on the home LAN with no firewall in front of its ports.
    evidence: [rig-ports-are-open-on-the-home-lan]
  - id: rig-holds-real-secrets
    belief: The rig holds real secret values in ~/.agent_composer/config/secrets.env.
    evidence: [rig-secrets-env-holds-real-values]
  - id: pkill-f-kills-the-ssh-shell
    belief: Over SSH, pkill -f matches and kills the session's own shell.
    evidence: [pkill-f-killed-the-ssh-shell]
  - id: agent-shells-have-no-tty-for-sudo
    belief: An agent's shell has no TTY, so it cannot answer a sudo password prompt.
    evidence: [agent-shells-have-no-tty]

  # ADR 0001, 0002: artifacts
  - id: agents-know-git-best
    belief: Git is the only version control system LLM agents are deeply trained on.
    evidence: [agents-are-trained-on-git]
  - id: git-merges-text-not-binaries
    belief: Git diffs and merges text well and binary files badly.
    evidence: [git-merges-binaries-badly]
  - id: some-artifacts-are-binary
    belief: Some artifacts are inherently binary, such as images, PDFs and video.
    evidence: [artifacts-include-images-pdfs-and-video]
  # Opinion: ADR 0002 says workflows "are expected to" take large media;
  # none does yet.
  - id: workflows-will-take-large-media
    belief: Workflows will take large media such as raw video and photo sets as input.

  # ADR 0003: tasks
  - id: host-subprocesses-share-the-host
    belief: Harnesses run as host subprocesses share the host's network, credentials, tools and process table.
    evidence: [host-harnesses-share-the-host]
  - id: microsandbox-spike-passed
    belief: On the rig, a microsandbox VM with Claude Code and Codex boots in under two seconds and keeps a detached terminal across disconnects.
    evidence: [microsandbox-spike-on-the-rig]

  # ADR 0004: secrets
  - id: agents-can-exfiltrate-what-they-read
    belief: An agent that runs arbitrary code can read and send out any credential it can see.
    evidence: [agents-run-arbitrary-code]
  - id: placeholder-secrets-work
    belief: microsandbox placeholder secrets swap in the real value only for allow-listed hosts, for Claude Code, the GitHub API and git over HTTPS.
    evidence: [microsandbox-spike-on-the-rig]

  # ADR 0005: messaging
  - id: task-vms-have-no-path-to-agc
    belief: An agent in a Task VM has no network path to agc and no identity agc can trust.
    evidence: [task-vms-have-no-route-to-agc]
  - id: vsock-has-nothing-to-firewall
    belief: vsock is a host-to-VM pipe with no IP address, no DNS and nothing to firewall.
    evidence: [vsock-is-a-host-to-vm-pipe]

  # ADR 0006: rules, beliefs and decisions
  - id: rules-and-beliefs-fail-differently
    belief: When reality disagrees with a rule the actor is wrong; when it disagrees with a belief the belief is wrong.
    evidence: [rules-and-beliefs-framing]

  # Design language (AGENTS.md). Opinion: the panel follows the rtsdesign
  # skill on this premise, and nobody has measured operator mistakes yet.
  - id: icon-and-shape-ui-reduces-operator-mistakes
    belief: An interface that speaks through icons, slots, numbers and shape, as strategy games do, leads operators to fewer mistakes than one that makes them read text or YAML.
