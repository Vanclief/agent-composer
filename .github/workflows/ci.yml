name: CI

# One question: is this commit shippable? The Go suite must pass, the
# committed web/dist bundle must match web/src, and the control panel
# (panel/) must pass its checks and build. Release calls this workflow, so
# nothing ships without all three.
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  web-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build web distribution
        run: npm run build
        working-directory: web
      - name: Verify committed distribution
        run: git diff --exit-code -- web/dist

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Install panel dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Types drift against docs/openapi.yaml, tsc, eslint, Playwright.
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            panel/playwright-report
            panel/test-results
          if-no-files-found: ignore
