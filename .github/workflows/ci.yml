name: CI

# One question, two halves: is this commit shippable? The Go suite must
# pass and the committed web/dist bundle must match web/src. Release
# calls this workflow, so nothing ships without both.
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  web-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build web distribution
        run: npm run build
        working-directory: web
      - name: Verify committed distribution
        run: git diff --exit-code -- web/dist
