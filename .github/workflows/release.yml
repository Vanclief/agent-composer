name: Release

# Manually triggered: pick patch/minor/major, tests run first, binaries
# are built for every supported platform, and a new semver tag + GitHub
# release carries them as assets. install.sh always fetches the latest
# release, so publishing here is what ships.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    needs: test
    # Binaries ship from master only
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the latest tag is reachable for git describe
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compute next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0)
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ inputs.bump }}" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Bumping ${latest} -> ${next}"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath \
                -ldflags "-s -w -X github.com/vanclief/agent-composer/interfaces/cli.version=${VERSION}" \
                -o "dist/agc-${target%/*}-${target#*/}" .
          done
          ls -la dist/

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/agc-*
