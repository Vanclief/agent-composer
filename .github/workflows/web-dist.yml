name: Verify web distribution

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  web-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build web distribution
        run: npm run build
        working-directory: web
      - name: Verify committed distribution
        run: git diff --exit-code -- web/dist
