      description: A question waits on the channel's readers until someone else replies to it.
    MsgPostRequest:
      type: object
      properties:
        participant_id:
          type: string
          description: The id join returned; it must belong to the caller.
        channel:
          type: string
          description: '`#` followed by 1-64 lowercase letters, digits, _ or -.'
        body:
          type: string
          description: Plain text, at most 64 KiB; may be empty when the post carries images.
        reply_to:
          type: integer
          format: int64
          description: Id of a message in the same channel this replies to.
        kind:
          $ref: '#/components/schemas/MsgKind'
        images:
          type: array
          maxItems: 4
          description: Up to 4 images (ADR 0005 "Images").
          items:
            $ref: '#/components/schemas/MsgImageUpload'
      required:
        - participant_id
        - channel
        - body
    MsgImageUpload:
      type: object
      description: An image as a post sends it.
      properties:
        name:
          type: string
          description: >
            The file name; agc keeps letters, digits, dots, dashes and underscores, adds the
            extension of the sniffed type and makes it unique within the message.
        data:
          type: string
          format: byte
          description: The bytes, base64; a PNG, JPEG, GIF or WebP of at most 5 MB.
      required:
        - name
        - data
    MsgImage:
      type: object
      description: An image a message carries (ADR 0005 "Images").
      properties:
        name:
          type: string
          description: The stored file name.
        type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
        size:
          type: integer
          format: int64
          description: Bytes.
        url:
          type: string
          description: Where it is served, `/api/msg/images/{id}/{name}`.
      required:
        - name
        - type
        - size
        - url
    MsgMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Also the read cursor; ids are global and totally ordered across channels.
        channel:
          type: string
        from:
          type: string
          description: The sender's name, filled in by agc.
        participant_id:
          type: string
        task:
          type: string
          description: The sender's task, empty for humans and for agc.
        agent:
          type: string
          description: >
            The home sandbox of the persistent agent that posted (ADR 0016), its first name;
            empty for everyone else.
        human:
          type: boolean
        reply_to:
          type: integer
          format: int64
        body:
          type: string
        kind:
          $ref: '#/components/schemas/MsgKind'
        images:
          type: array
          description: The images the message carries; absent for a text-only message.
          items:
            $ref: '#/components/schemas/MsgImage'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - channel
        - from
        - participant_id
        - task
        - agent
        - human
        - body
        - kind
        - created_at
    MsgMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MsgMessage'
        cursor:
          type: integer
          format: int64
          description: The id to pass as `after` next time; the given `after` when empty.
      required:
        - messages
        - cursor
    MsgQuestion:
      allOf:
        - $ref: '#/components/schemas/MsgMessage'
        - type: object
          properties:
            answer_id:
              type: integer
              format: int64
              nullable: true
              description: The first reply from someone other than the asker.
            answered_by:
              type: string
              nullable: true
            answered_at:
              type: string
              format: date-time
              nullable: true
          required:
            - answer_id
            - answered_by
            - answered_at
    MsgQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/MsgQuestion'
      required:
        - questions
    MsgParticipantList:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/MsgParticipant'
      required:
        - participants
    MsgParticipant:
      type: object
      description: >
        A name agc handed out on join (ADR 0005). online and last_seen_at are computed per
        request, never stored.
      properties:
        id:
          type: string
        name:
          type: string
        task:
          type: string
          description: The task that joined it; empty for humans and agc.
        agent:
          type: string
          description: >
            The home sandbox of the persistent agent that joined it (ADR 0016); empty for everyone
            else. Such a participant is online while that home runs.
        human:
          type: boolean
        joined_at:
          type: string
          format: date-time
        left_at:
          type: string
          format: date-time
          description: Set once the participant left; absent while active.
        online:
          type: boolean
          description: >
            Never for agc or a participant that left. An agent (human false, task set) is online
            while the sandbox named like it is running, or, when no sandbox has its name, while
            any sandbox of its task is; with no sandbox status wired, whenever it has not left.
            A human is online when last_seen_at is within the last 5 minutes.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: >
            An agent's latest message. For a human, the later of its latest message and its
            latest /read, /wait (with participant=<id>) or /post, the latter kept in memory and
            lost on restart. Null when there is neither.
      required:
        - id
        - name
        - task
        - agent
        - human
