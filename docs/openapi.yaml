        event_type:
          $ref: '#/components/schemas/HookEventType'
        agent_name:
          type: string
        command:
          type: string
        args:
          type: array
          nullable: true
          items:
            type: string
        enabled:
          type: boolean
      description: Supply at least one mutable field; otherwise the service returns EINVALID.
    Harness:
      type: string
      enum:
        - codex_cli
        - claude_code
    ReasoningEffort:
      type: string
      enum:
        - high
        - medium
        - low
    ConversationStatus:
      type: string
