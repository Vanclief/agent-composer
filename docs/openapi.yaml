          items:
            type: string
      required:
        - name
        - hosts
    KnowledgeLabel:
      type: string
      description: >
        How what a belief, decision, rule or action rests on is grounded: grounded (live evidence
        under every leaf of some set of reasons), judgment (a leaf with no evidence that comes
        from a person's experience; wins over grounded), opinion (a leaf with no evidence and no
        experience; wins over judgment), in_doubt (a leaf whose evidence is all retracted or set
        aside; wins over the others) or contested (beliefs only: something grounded contradicts
        it or its evidence; wins over opinion).
      enum:
        - grounded
        - judgment
        - opinion
        - in_doubt
        - contested
    Retraction:
      type: object
      properties:
        who:
          type: string
        when:
          type: string
        why:
          type: string
      required:
        - who
        - when
        - why
    KnowledgeSet:
      type: object
      properties:
        dir:
          type: string
          description: The knowledge directory loaded.
        without:
          type: array
          description: The ids set aside with ?without=, [] normally.
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/Belief'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeAction'
        proposals:
          type: array
          description: Every proposal with how it stands at the gate now (ADR 0007).
          items:
            $ref: '#/components/schemas/KnowledgeProposal'
        gates:
          type: array
          description: Every gate with the tier it gives now and its counts, ending with the default gate, whose id is empty.
          items:
            $ref: '#/components/schemas/KnowledgeGate'
      required:
        - dir
        - without
        - evidence
        - beliefs
        - decisions
        - rules
        - actions
        - proposals
        - gates
    Evidence:
      type: object
      description: Something seen. Retracted evidence stays in its file but grounds nothing.
      properties:
        id:
          type: string
        text:
          type: string
        who:
          type: string
        when:
          type: string
        source:
          type: string
          description: A URL, a file path or a command whose output was seen; empty when unset.
        translated_by:
          type: string
          description: The model that wrote the record from the source; empty when none did.
        retracted:
          allOf:
            - $ref: '#/components/schemas/Retraction'
          nullable: true
        contradicts:
          type: array
          description: Ids of the beliefs and evidence this evidence says it contradicts.
          items:
            type: string
        cited_by:
          type: array
          description: Ids of the beliefs citing this evidence.
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - who
        - when
        - source
        - translated_by
        - retracted
        - contradicts
        - cited_by
        - file
    Belief:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs this one rests on.
          items:
            type: string
        evidence:
          type: array
          description: Ids of the evidence this belief cites.
          items:
            type: string
        or:
          type: array
          description: >
            Alternative sets of reasons, each the ids of its beliefs then its evidence; the
            belief is grounded if its own set or any of these is. [] when none.
          items:
            type: array
            items:
              type: string
        experience:
          type: object
          nullable: true
          description: >
            Whose experience, and in what, a leaf belief comes from, which makes it a judgment;
            null when absent.
          properties:
            of:
              type: string
            in:
              type: string
          required:
            - of
            - in
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          description: Leaf beliefs with no evidence.
          items:
            type: string
        doubted:
          type: array
          description: Leaf beliefs whose evidence is all retracted.
          items:
            type: string
        retracted:
          type: array
          description: The retracted evidence of the doubted leaves.
          items:
            type: string
        contested_by:
          type: array
          description: >
            The grounded beliefs and live evidence contradicting this belief or the evidence it
            cites, when it is contested.
          items:
            type: string
        file:
          type: string
        by:
          type: string
          description: >
            Who holds or stated the belief, a person or an agent; empty for the repo owner.
            Never grounds it: an agent's verdict recorded by agc rules judge is an opinion.
        when:
          type: string
          description: When by held or stated it; empty when unset.
      required:
        - id
        - text
        - because
        - evidence
        - or
        - experience
        - label
        - opinions
        - doubted
        - retracted
        - contested_by
        - file
        - by
        - when
    Decision:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs and decisions this one rests on.
          items:
            type: string
        adr:
          type: string
          description: Path of the ADR; empty when unset.
        decided:
          type: object
          properties:
            who:
              type: string
            when:
              type: string
          required:
            - who
            - when
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - because
        - adr
        - decided
        - label
        - opinions
        - doubted
        - file
    Rule:
      type: object
      properties:
        subject:
          type: string
          description: The subject of the ruleset the rule is in.
        id:
          type: string
        text:
          type: string
        check:
          type: string
          description: Shell command whose exit status says whether the rule holds; never run by the API.
        because:
          type: array
          items:
            type: string
        kind:
          type: string
          description: >
            mechanical when the rule has a check (it may also be judged), judged when it has
            only a judge block, manual when it has neither.
          enum:
            - mechanical
            - judged
            - manual
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
        trusted:
          type: array
          description: >
            Who is trusted to judge the rule (agc rules judge): harness ids or people. [] when
            the rule has no judge block.
          items:
            type: string
        ask:
          type: string
          description: The question put to a judge; empty means the rule text.
      required:
        - subject
        - id
        - text
        - check
        - because
        - kind
        - label
        - opinions
        - doubted
        - file
        - trusted
        - ask
    Reason:
      type: object
      description: >
        A belief, decision, rule or action, the evidence it cites (beliefs only), what it rests
        on and its alternative sets of reasons, each a Reason. A piece of evidence inside an
        alternative is a Reason of kind evidence, with who, when, translated_by and retracted
        set and nothing under it.
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - belief
            - decision
            - rule
            - action
            - evidence
        text:
          type: string
        who:
          type: string
          description: Kind evidence only.
        when:
          type: string
          description: Kind evidence only.
        translated_by:
          type: string
          description: Kind evidence only; absent when no model wrote the record.
        retracted:
          allOf:
            - $ref: '#/components/schemas/Retraction'
          description: Kind evidence only; absent when live.
        evidence:
          type: array
          description: The evidence the node's own set of reasons cites.
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              who:
                type: string
              when:
                type: string
              translated_by:
                type: string
                description: The model that wrote the record from its source; empty when none did.
              retracted:
                allOf:
                  - $ref: '#/components/schemas/Retraction'
                nullable: true
            required:
              - id
              - text
              - who
              - when
              - translated_by
              - retracted
        because:
          type: array
          description: What the node's own set of reasons rests on.
          items:
            $ref: '#/components/schemas/Reason'
        or:
          type: array
          description: >
            Alternative sets of reasons, each a list of nodes: the beliefs and decisions it rests
            on, then its evidence. [] when none.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Reason'
      required:
        - id
        - kind
        - text
        - evidence
        - because
        - or
    Doubted:
      type: object
      properties:
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/Belief'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        actions:
          type: array
          description: Open actions only.
          items:
            $ref: '#/components/schemas/KnowledgeAction'
        standing:
          $ref: '#/components/schemas/KnowledgeStandingSet'
      required:
        - beliefs
        - decisions
        - rules
        - actions
        - standing
    KnowledgeAction:
      type: object
      description: Something to do because of a decision, with the status of what it rests on.
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the decisions and beliefs this action rests on.
          items:
            type: string
        opened:
          $ref: '#/components/schemas/KnowledgeObservation'
        done:
          allOf:
            - $ref: '#/components/schemas/KnowledgeObservation'
          nullable: true
          description: Null while the action is open.
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - because
        - opened
        - done
        - label
        - opinions
        - doubted
        - file
    KnowledgeTier:
      type: string
      description: How much of a human a proposal needs before it lands (ADR 0007).
      enum: [decide, observe, delegated]
    KnowledgeProposal:
      type: object
      description: |
        What an agent put forward, with what it rests on and how it stands at the gate now:
        the gate covering it, the tier the gate is written with, the tier it gets and why they
        differ. Computed on every request, never stored.
      properties:
        id:
          type: string
        proposes:
          type: string
          description: What kind of thing is proposed.
          enum: [rule, belief, evidence, decision, action, gate, code]
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs and decisions the proposal rests on.
          items:
            type: string
        evidence:
          type: array
          description: Ids of the evidence the proposal cites.
          items:
            type: string
        by:
          type: string
          description: Who proposed it, an agent id or a person.
        when:
          type: string
        change:
          type: string
          description: Where the change itself lives (a branch, a commit, a path), or empty.
        became:
          type: string
          description: The id it was recorded under once accepted, or empty.
        accepted:
          allOf:
            - $ref: '#/components/schemas/KnowledgeObservation'
          nullable: true
          description: Null unless accepted.
        rejected:
          allOf:
            - $ref: '#/components/schemas/KnowledgeRejection'
          nullable: true
          description: Null unless rejected.
        gate:
          type: string
          description: Id of the gate covering it, empty when none does and the default applies.
        written:
          $ref: '#/components/schemas/KnowledgeTier'
        tier:
          $ref: '#/components/schemas/KnowledgeTier'
        audited:
          type: boolean
          description: An observe gate sampled this one, so it needs a decision.
        tightened_by:
          type: array
          description: Rejected proposals under the same gate that pulled it to decide.
          items:
            type: string
        illegible:
          type: boolean
          description: It acts and rests on nothing, so there is no why to read; it needs a decision.
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - proposes
        - text
        - because
        - evidence
        - by
        - when
        - change
        - became
        - accepted
        - rejected
        - gate
        - written
        - tier
        - audited
        - tightened_by
        - illegible
        - label
        - opinions
        - doubted
        - file
    KnowledgeRejection:
      type: object
      description: Who turned a proposal down, when and why.
      properties:
        who:
          type: string
        when:
          type: string
        why:
          type: string
      required:
        - who
        - when
        - why
    KnowledgeGate:
      type: object
      description: |
        A gate with the tier it gives now and how the proposals under it have gone. The last
        gate in the list has an empty id: the default for proposals no gate covers.
      properties:
        id:
          type: string
        proposes:
          type: string
        by:
          type: array
          description: Proposers covered; empty means anyone.
          items:
            type: string
        written:
          $ref: '#/components/schemas/KnowledgeTier'
        tier:
          $ref: '#/components/schemas/KnowledgeTier'
        sample:
          type: integer
          description: On an observe gate, about one in this many is audited; 0 means none.
        since:
          type: string
          description: Rejections before this day do not tighten the gate; empty counts every one.
        because:
          type: array
          items:
            type: string
        tightened_by:
          type: array
          items:
            type: string
        open:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        audited:
          type: integer
        all_accepted:
          type: boolean
          description: A decide gate that has accepted five or more and rejected none.
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - proposes
        - by
        - written
        - tier
        - sample
        - since
        - because
        - tightened_by
        - open
        - accepted
        - rejected
        - audited
        - all_accepted
        - label
        - opinions
        - doubted
        - file
    KnowledgeObservation:
      type: object
      description: Who did something, and when.
      properties:
        who:
          type: string
        when:
          type: string
      required:
        - who
        - when
    KnowledgeStandingSet:
      type: object
      description: >
        What rests on the doubted id in some sets of its reasons but still stands on another,
        by kind. Only open actions are listed.
      properties:
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
      required:
        - beliefs
        - decisions
        - rules
        - actions
    KnowledgeStanding:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        other:
          type: array
          description: The sets of reasons that do not reach the doubted id, each as its ids.
          items:
            type: array
            items:
              type: string
        file:
          type: string
      required:
        - id
        - text
        - other
        - file
    KnowledgeConflictSet:
      type: object
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeConflict'
      required:
        - conflicts
    KnowledgeConflict:
      type: object
      description: >
        A contradiction where at least one side is contested. a_rests_on and b_rests_on are the
        leaves under each side, live evidence then opinions; a piece of evidence rests on itself.
      properties:
        a:
          $ref: '#/components/schemas/KnowledgeConflictSide'
        b:
          $ref: '#/components/schemas/KnowledgeConflictSide'
        a_rests_on:
          type: array
          items:
            type: string
        b_rests_on:
          type: array
          items:
            type: string
      required:
        - a
        - b
        - a_rests_on
        - b_rests_on
    KnowledgeConflictSide:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - belief
            - evidence
        text:
          type: string
      required:
        - id
        - kind
        - text
    ScheduleTemplate:
      type: object
      description: >
        The task a schedule creates: the fields of CreateTaskRequest. title, name, brief and each
        accept entry are Go text/templates over the item's fields (.key, .url, ...) and .Now, the
        tick's time; a field the item lacks is an error. Without name the task is
        <schedule>-<yyyymmdd-hhmm> (UTC) without a poll, <schedule>-<first 8 hex of the key's
        SHA-256> with one. Without title, a poll item's `title` field is the task title.
        manager is required.
      properties:
        title:
          type: string
        name:
          type: string
        brief:
          type: string
        accept:
          type: array
          items:
            type: string
        assignee:
          type: string
        model:
          type: string
        manager:
          type: string
        owner:
          type: string
        for:
          type: string
        sandbox:
          $ref: '#/components/schemas/SandboxRequest'
    SchedulePoll:
      type: object
      description: >
        A command run on the agc host with sh -c. Each non-empty stdout line is a JSON object of
        string fields with a non-empty key. secrets are names in the secrets file, set in the
        command's environment; their values are redacted from last_error.
      required:
        - command
      properties:
        command:
          type: string
        secrets:
          type: array
          items:
            type: string
    CreateScheduleRequest:
      type: object
      required:
        - name
        - every
        - task
      properties:
        name:
          type: string
          description: 1-63 lowercase letters, digits or -, starting with a letter, and not a UUID.
        every:
          type: string
          description: A Go duration such as 2m or 1h, at least 1m.
        enabled:
          type: boolean
          description: Defaults to true.
        task:
          $ref: '#/components/schemas/ScheduleTemplate'
        poll:
          $ref: '#/components/schemas/SchedulePoll'
    UpdateScheduleRequest:
      type: object
      required:
        - every
        - task
      properties:
        every:
          type: string
        enabled:
          type: boolean
          description: Defaults to true.
        task:
          $ref: '#/components/schemas/ScheduleTemplate'
        poll:
          $ref: '#/components/schemas/SchedulePoll'
    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        every:
          type: string
        enabled:
          type: boolean
        task:
          $ref: '#/components/schemas/ScheduleTemplate'
        poll:
          allOf:
            - $ref: '#/components/schemas/SchedulePoll'
          nullable: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: When the last tick started, failed ones included.
        last_error:
          type: string
          description: The last tick's error, empty when it succeeded.
        next_run_at:
          type: string
          format: date-time
          nullable: true
          description: last_run_at plus every (created_at before the first run); null while disabled.
        running:
          type: boolean
          description: True while a tick of this schedule runs.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - every
        - enabled
        - task
        - poll
        - last_run_at
        - last_error
        - next_run_at
        - running
        - created_at
        - updated_at
    ScheduleList:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
      required:
        - schedules
    ScheduleRunResponse:
      type: object
      properties:
        schedule:
          $ref: '#/components/schemas/Schedule'
        created:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        error:
          type: string
          description: The tick's error, empty when it succeeded.
      required:
        - schedule
        - created
        - error
    ScheduleItem:
      type: object
      properties:
        key:
          type: string
        task:
          type: string
          description: The created task's name, kept after the task is deleted.
        task_id:
          type: string
          format: uuid
        seen_at:
          type: string
          format: date-time
      required:
        - key
        - task
        - task_id
        - seen_at
    ScheduleItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
      required:
        - items
    DeleteScheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
    DeleteTaskResponse:
      type: object
      properties:
        deleted:
          type: boolean
        name:
          type: string
      required:
        - deleted
        - name
    CreateHookRequest:
      type: object
      required:
        - event_type
        - command
        - enabled
      properties:
        event_type:
          $ref: '#/components/schemas/HookEventType'
        agent_name:
          type: string
          description: Empty string (or omission) registers a wildcard hook.
        command:
          type: string
        args:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    UpdateHookRequest:
      type: object
      properties:
        hook_id:
          type: string
          format: uuid
          readOnly: true
          description: Filled from the path parameter; omit in the payload.
        event_type:
          $ref: '#/components/schemas/HookEventType'
        agent_name:
          type: string
        command:
          type: string
        args:
          type: array
          nullable: true
          items:
            type: string
        enabled:
          type: boolean
      description: Supply at least one mutable field; otherwise the service returns EINVALID.
    Harness:
      type: string
      enum:
        - codex_cli
        - claude_code
    ReasoningEffort:
      type: string
      enum:
        - high
        - medium
        - low
    ConversationStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - canceled
    HookEventType:
      type: string
      enum:
        - conversation_started
        - conversation_ended
        - context_exceeded
        - pre_context_compaction
        - post_context_compaction
        - pre_tool_use
        - post_tool_use
    MessageRole:
      type: string
      enum:
        - system
        - user
        - assistant
        - tool
    JSONValue:
      description: Represents an arbitrary JSON value.
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: integer
        - type: boolean
    MsgErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MsgKind:
      type: string
      enum: [message, question]
      description: A question waits on the channel's readers until someone else replies to it.
    MsgPostRequest:
      type: object
      properties:
        participant_id:
          type: string
          description: The id join returned; it must belong to the caller.
        channel:
          type: string
          description: '`#` followed by 1-64 lowercase letters, digits, _ or -.'
        body:
          type: string
          description: Plain text, at most 64 KiB.
        reply_to:
          type: integer
          format: int64
          description: Id of a message in the same channel this replies to.
        kind:
          $ref: '#/components/schemas/MsgKind'
      required:
        - participant_id
        - channel
        - body
    MsgMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Also the read cursor; ids are totally ordered per channel.
        channel:
          type: string
        from:
          type: string
          description: The sender's name, filled in by agc.
        participant_id:
          type: string
        task:
          type: string
          description: The sender's task, empty for humans and for agc.
        human:
          type: boolean
        reply_to:
          type: integer
          format: int64
        body:
          type: string
        kind:
          $ref: '#/components/schemas/MsgKind'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - channel
        - from
        - participant_id
        - task
        - human
        - body
        - kind
        - created_at
    MsgQuestion:
      allOf:
        - $ref: '#/components/schemas/MsgMessage'
        - type: object
          properties:
            answer_id:
              type: integer
              format: int64
              nullable: true
              description: The first reply from someone other than the asker.
            answered_by:
              type: string
              nullable: true
            answered_at:
              type: string
              format: date-time
              nullable: true
          required:
            - answer_id
            - answered_by
            - answered_at
    MsgQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/MsgQuestion'
      required:
        - questions
