        - conversation_started
        - conversation_ended
        - context_exceeded
        - pre_context_compaction
        - post_context_compaction
        - pre_tool_use
        - post_tool_use
    MessageRole:
      type: string
      enum:
        - system
        - user
        - assistant
        - tool
    JSONValue:
      description: Represents an arbitrary JSON value.
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: integer
        - type: boolean
    MsgErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MsgKind:
      type: string
