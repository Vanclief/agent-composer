          items:
            type: string
        open:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        audited:
          type: integer
        all_accepted:
          type: boolean
          description: A decide gate that has accepted five or more and rejected none.
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - proposes
        - by
        - written
        - tier
        - sample
        - since
        - because
        - tightened_by
        - open
        - accepted
        - rejected
        - audited
        - all_accepted
        - label
        - opinions
        - doubted
        - file
    KnowledgeObservation:
      type: object
      description: Who did something, and when.
      properties:
        who:
          type: string
        when:
          type: string
      required:
        - who
        - when
    KnowledgeStandingSet:
      type: object
      description: >
        What rests on the doubted id in some sets of its reasons but still stands on another,
        by kind. Only open actions are listed.
      properties:
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
      required:
        - beliefs
        - decisions
        - rules
        - actions
    KnowledgeStanding:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        other:
          type: array
          description: The sets of reasons that do not reach the doubted id, each as its ids.
          items:
            type: array
            items:
              type: string
        file:
          type: string
      required:
        - id
        - text
        - other
        - file
    KnowledgeConflictSet:
      type: object
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeConflict'
      required:
        - conflicts
    KnowledgeConflict:
      type: object
      description: >
        A contradiction where at least one side is contested. a_rests_on and b_rests_on are the
        leaves under each side, live evidence then opinions; a piece of evidence rests on itself.
      properties:
        a:
          $ref: '#/components/schemas/KnowledgeConflictSide'
        b:
          $ref: '#/components/schemas/KnowledgeConflictSide'
        a_rests_on:
          type: array
          items:
            type: string
        b_rests_on:
          type: array
          items:
            type: string
      required:
        - a
        - b
        - a_rests_on
        - b_rests_on
    KnowledgeConflictSide:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - belief
            - evidence
        text:
          type: string
      required:
        - id
        - kind
        - text
    CreateAgentRequest:
      type: object
      properties:
        role:
          type: string
          description: The template's name, agents/<role>.yaml, in any case.
        harness:
          type: string
          description: claude_code, codex_cli or pi; empty takes the template's, then the default.
        model:
          type: string
          description: Empty takes the template's (for its harness), then the default.
        effort:
          type: string
          enum: ['', low, medium, high, xhigh]
          description: Reasoning effort; empty takes the template's, else the harness's default.
      required:
        - role
    KeepAgentRequest:
      type: object
      properties:
        name:
          type: string
          description: Up to 32 lowercase letters, digits and dashes.
        role:
          type: string
          description: Omitted keeps the role.
      required:
        - name
    AgentRule:
      type: object
      description: A rule an agent follows, from the knowledge directory (ADR 0006).
      properties:
        id:
          type: string
        rule:
          type: string
          description: The rule's text as written.
      required:
        - id
        - rule
    AgentTask:
      type: object
      properties:
        name:
          type: string
          description: The task's name, also its channel.
        status:
          type: string
          description: The task's status, verbatim.
      required:
        - name
        - status
    AgentConversation:
      type: object
      properties:
        channel:
          type: string
        last_at:
          type: string
          format: date-time
          description: The last message's time; the agent's or the task's creation when none.
      required:
        - channel
        - last_at
    Agent:
      type: object
      description: A persistent agent (ADR 0016).
      properties:
        name:
          type: string
          description: Unique; <role>-<n> until kept, then its name.
        role:
          type: string
        kept:
          type: boolean
        harness:
          type: string
        model:
          type: string
        effort:
          type: string
          enum: ['', low, medium, high, xhigh]
          description: The harness's reasoning effort, from the template or the create request; empty for the harness's default.
        owner:
          type: string
        state:
          type: string
          description: >
            Computed from the home sandbox, never stored: asleep (no home, or stopped), waking
            (starting), awake (running), otherwise the sandbox's own status verbatim (failed,
            stopping, unknown). In an agent.state event, deleted once it is gone.
        home:
          type: string
          nullable: true
          description: The home sandbox's name; null before the first wake.
        rules:
          type: array
          description: >
            The rules its template names (ADR 0016 item 2), in template order, read from the
            knowledge directory on the request; [] when it names none or they cannot be read.
          items:
            $ref: '#/components/schemas/AgentRule'
        tasks:
          type: array
          description: The tasks whose manager is the agent.
          items:
            $ref: '#/components/schemas/AgentTask'
        conversations:
          type: array
          description: >
            The agent's inbox #<name> first, then #<task> for each of its tasks, then any
            other channel the agent has posted in, newest first.
          items:
            $ref: '#/components/schemas/AgentConversation'
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: The newest message among its conversations, or its last wake.
        skills:
          type: array
          items:
            type: string
          description: >
            The template's sandbox.skills, read on every request; empty when it names none or
            cannot be read (ADR 0016 item 2).
        turns:
          type: integer
          minimum: 1
          maximum: 8
          description: >
            How many turns of different threads its home runs at once: the template's turns,
            read on every request, 3 when it sets none or cannot be read (ADR 0016 items 2
            and 7). GET /agent on the home's socket carries it too.
        created_at:
          type: string
          format: date-time
      required:
        - name
        - role
        - kept
        - harness
        - model
        - effort
        - owner
        - state
        - home
        - rules
        - tasks
        - conversations
        - skills
        - turns
        - last_active_at
        - created_at
    Skill:
      type: object
      description: A skill of the skills repository (ADR 0008 "Skills").
      properties:
        name:
          type: string
          description: The directory's name, a slug such as rtsdesign.
        description:
          type: string
          description: The description in the SKILL.md frontmatter; empty when absent.
      required:
        - name
        - description
    SkillList:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
      required:
        - skills
    AgentList:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
      required:
        - agents
    DeleteAgentResponse:
      type: object
      properties:
        deleted:
          type: boolean
        name:
          type: string
      required:
        - deleted
        - name
    ScheduleTemplate:
      type: object
      description: >
        The task a schedule creates: the fields of CreateTaskRequest. title, name, brief and each
        accept entry are Go text/templates over the item's fields (.key, .url, ...) and .Now, the
        tick's time; a field the item lacks is an error. Without name the task is
        <schedule>-<yyyymmdd-hhmm> (UTC) without a poll, <schedule>-<first 8 hex of the key's
        SHA-256> with one. Without title, a poll item's `title` field is the task title.
        manager is required.
      properties:
        title:
          type: string
        name:
          type: string
        brief:
          type: string
        accept:
          type: array
          items:
            type: string
        assignee:
          type: string
        model:
          type: string
        manager:
          type: string
        owner:
          type: string
        for:
          type: string
        sandbox:
          $ref: '#/components/schemas/SandboxRequest'
    SchedulePoll:
      type: object
      description: >
        A command run on the agc host with sh -c. Each non-empty stdout line is a JSON object of
        string fields with a non-empty key. secrets are names in the secrets file, set in the
        command's environment; their values are redacted from last_error.
      required:
        - command
      properties:
        command:
          type: string
        secrets:
          type: array
          items:
            type: string
    CreateScheduleRequest:
      type: object
      required:
        - name
        - every
        - task
      properties:
        name:
          type: string
          description: 1-63 lowercase letters, digits or -, starting with a letter, and not a UUID.
        every:
          type: string
          description: A Go duration such as 2m or 1h, at least 1m.
        enabled:
          type: boolean
          description: Defaults to true.
        task:
          $ref: '#/components/schemas/ScheduleTemplate'
        poll:
          $ref: '#/components/schemas/SchedulePoll'
    UpdateScheduleRequest:
      type: object
      required:
        - every
        - task
      properties:
        every:
          type: string
        enabled:
          type: boolean
          description: Defaults to true.
        task:
          $ref: '#/components/schemas/ScheduleTemplate'
        poll:
          $ref: '#/components/schemas/SchedulePoll'
    Account:
      type: object
      description: An account, never its value (ADR 0018).
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]{1,32}$'
        provider:
          $ref: '#/components/schemas/AccountProvider'
        kind:
          $ref: '#/components/schemas/AccountKind'
        secret:
          type: string
          description: The secrets.env name holding the value, ACCOUNT_<NAME>.
        email:
          type: string
          description: The account's email, empty when not given.
        default:
          type: boolean
          description: Whether this is its provider's default account.
        created_at:
          type: string
          format: date-time
        signed_in_at:
          type: string
          format: date-time
          nullable: true
          description: When the account last signed in through agc (ADR 0018 "Sign-in"), null when it has no login.
        usage:
          allOf:
            - $ref: '#/components/schemas/AccountUsage'
          nullable: true
          description: >
            Usage for anthropic oauth accounts once the usage fetcher is wired, else null. `error`
            starts with "inference-only token" when the account's own token cannot read usage, and
            with "sign-in expired" when its login was refused: both ask for a sign-in.
      required:
        - name
        - provider
        - kind
        - secret
        - email
        - default
        - created_at
        - signed_in_at
        - usage
    AccountProvider:
      type: string
      enum: [anthropic, openai]
    AccountKind:
      type: string
      enum: [oauth, api_key]
    AccountUsage:
