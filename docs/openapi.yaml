openapi: 3.0.3
info:
  title: Agent Composer REST API
  version: 0.1.0
  description: >
    REST interface exposed by the Agent Composer service. The routes documented here were
    generated directly from the Echo handlers in `interfaces/rest/handler` and cover agent
    specs, agent conversations, and runtime hooks. All responses are JSON encoded and share a
    common error envelope.
servers:
  - url: http://localhost:1202/api
    description: Local development server
  - url: /api
    description: Relative base path when the service is deployed behind another host
tags:
  - name: Agent Specs
    description: CRUD operations for reusable agent definitions.
  - name: Conversations
    description: Manage agent conversation runs and forks.
  - name: Hooks
    description: Manage runtime hooks that trigger external commands.
  - name: Workflows
    description: Inspect installed workflows.
  - name: Tasks
    description: >
      A task is work to be done, in words (ADR 0008). It allocates compute as sandboxes. Its
      status is computed: done, review, running or open (ADR 0010).
  - name: Schedules
    description: >
      A schedule creates a task from a template every interval, or one task per new item its poll
      command lists (ADR 0012). agc rest runs the scheduler; next_run_at is computed, never stored.
  - name: Accounts
    description: >
      An account is a credential for one provider (ADR 0018), kept as a line of secrets.env
      (ACCOUNT_<NAME>) and described by a row. At most one account per provider is the default,
      bound to a sandbox whose spec names no credential variable of its harness. No route returns
      a value.
  - name: Agents
    description: >
      A persistent agent (ADR 0016) is a row, not a process: born numbered from a role template
      (agents/<role>.yaml under the agc home, AGC_AGENTS_DIR overrides), kept under a name, asleep
      by default and woken in its home sandbox when someone talks to it. Its state is computed
      from the home sandbox, never stored.
  - name: Sandboxes
    description: >
      A sandbox is the compute a task is allocated: one microsandbox VM (ADR 0003, ADR 0008).
      Once booted, its status is read live from the runtime and passed through verbatim.
  - name: Agents
    description: >
      Persistent agents (ADR 0016). An agent's memory is its volume agc-<name>, and the harness
      transcripts on it are the record its turns are read from.
  - name: Events
    description: >
      The live feed: a server-sent events stream of what changes tasks, sandboxes and channels.
  - name: Skills
    description: >
      agc's skills repository (ADR 0008 "Skills"): <agc home>/skills/<name>/SKILL.md plus files
      (AGC_SKILLS_DIR overrides), read on every request. A spec's skills are written into every
      sandbox agc prepares.
  - name: Knowledge
    description: >
      Evidence, beliefs, decisions and rules (ADR 0006), read only. Labels are computed on every
      request and never stored; checks are never run.
  - name: Messaging
    description: >
      Channels, participants and messages (ADR 0005), served by the same handler on agc's REST API
      for humans and on each sandbox's socket for its task. Only the routes below are documented
      here; join, leave, read and channels are in messaging/httpapi. A participant's
      presence (online, last_seen_at) is computed on every request and never stored. Errors
      are `{"error": "<message>"}`.
paths:
  /agents/specs:
    get:
      tags: [Agent Specs]
      operationId: listAgentSpecs
      summary: List agent specs
      description: >
        Returns the newest agent specs first. Results are cursor paginated and can be filtered by
        an optional case-insensitive search over the spec name and by `harness`.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: harness
          in: query
          schema:
            $ref: '#/components/schemas/Harness'
          description: Only return specs using the specified harness.
      responses:
        '200':
          description: Cursor-paginated agent specs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpecListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Agent Specs]
      operationId: createAgentSpec
      summary: Create an agent spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentSpecRequest'
      responses:
        '200':
          description: The newly created agent spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpec'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/specs/{id}:
    get:
      tags: [Agent Specs]
      operationId: getAgentSpec
      summary: Retrieve an agent spec
      parameters:
        - $ref: '#/components/parameters/AgentSpecIdParam'
      responses:
        '200':
          description: The requested agent spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Agent Specs]
      operationId: updateAgentSpec
      summary: Update an agent spec
      parameters:
        - $ref: '#/components/parameters/AgentSpecIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentSpecRequest'
      responses:
        '200':
          description: The updated agent spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Agent Specs]
      operationId: deleteAgentSpec
      summary: Delete an agent spec
      parameters:
        - $ref: '#/components/parameters/AgentSpecIdParam'
      responses:
        '200':
          description: UUID of the deleted spec.
          content:
            application/json:
              schema:
                type: string
                format: uuid
                description: Identifier that was deleted.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversations
      description: >
        Returns the newest conversations first. `search` matches agent names, `agent_spec_id`
        filters to a single spec, `harness` filters by harness type, `status` filters the
        conversation lifecycle state, and `session_id` restricts results to a client session.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring applied to `agent_name`.
        - name: harness
          in: query
          schema:
            $ref: '#/components/schemas/Harness'
          description: Only return conversations using the specified harness.
        - name: agent_spec_id
          in: query
          schema:
            type: string
            format: uuid
          description: Limit results to a single agent spec.
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConversationStatus'
          description: Filter by the most recent conversation status.
        - name: session_id
          in: query
          schema:
            type: string
          description: Filter by a client-provided session identifier.
      responses:
        '200':
          description: Cursor-paginated conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Start one or more conversations
      description: >
        Starts one or more harness-backed conversations from an agent spec. If the targeted spec
        still relies on unsupported legacy runtime options such as hooks, automatic compaction,
        structured outputs, or top-level web search flags, the service returns EINVALID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: Identifiers of the enqueued conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreateResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations/{id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Retrieve a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      responses:
        '200':
          description: The requested conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Conversations]
      operationId: updateConversation
      summary: Update a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: The updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      responses:
        '200':
          description: UUID of the deleted conversation.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations/{id}/fork:
    post:
      tags: [Conversations]
      operationId: forkConversation
      summary: Fork a conversation
      description: >
        Clones the specified conversation, then immediately continues it with a new prompt,
        returning the identifier of the fork. Forked conversations start a fresh harness session
        and do not inherit the prior run's `harness_session_ref`.
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkConversationRequest'
      responses:
        '200':
          description: UUID of the newly created fork.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations/{id}/resume:
    post:
      tags: [Conversations]
      operationId: resumeConversation
      summary: Resume a conversation
      description: >
        Enqueues more model work on the same conversation with a new prompt and returns its
        identifier (which matches the path parameter). For harnesses that support resume, such as
        `codex_cli` and `claude_code`, the service resumes the stored `harness_session_ref` when
        one is available.
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeConversationRequest'
      responses:
        '200':
          description: UUID of the resumed conversation.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /hooks:
    get:
      tags: [Hooks]
      operationId: listHooks
      summary: List hooks
      description: >
        Returns hooks ordered by cursor. `search` matches the agent name or command, `event_type`
        narrows down to a hook category, and `agent_name` filters to hooks bound to one agent.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring applied to agent names and commands.
        - name: event_type
          in: query
          schema:
            $ref: '#/components/schemas/HookEventType'
          description: Only return hooks that fire on this event type.
        - name: agent_name
          in: query
          schema:
            type: string
          description: Filter hooks that target a specific agent name (empty value is treated as wildcard).
      responses:
        '200':
          description: Cursor-paginated hooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Hooks]
      operationId: createHook
      summary: Create a hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHookRequest'
      responses:
        '200':
          description: The newly created hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /hooks/{id}:
    get:
      tags: [Hooks]
      operationId: getHook
      summary: Retrieve a hook
      parameters:
        - $ref: '#/components/parameters/HookIdParam'
      responses:
        '200':
          description: The requested hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Hooks]
      operationId: updateHook
      summary: Update a hook
      parameters:
        - $ref: '#/components/parameters/HookIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHookRequest'
      responses:
        '200':
          description: The updated hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Hooks]
      operationId: deleteHook
      summary: Delete a hook
      parameters:
        - $ref: '#/components/parameters/HookIdParam'
      responses:
        '200':
          description: UUID of the deleted hook.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /workflows:
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: List workflows
      description: Returns installed workflows from the registry.
      responses:
        '200':
          description: Installed workflow summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '500':
          $ref: '#/components/responses/Error'
  /workflows/{slug}:
    get:
      tags: [Workflows]
      operationId: getWorkflow
      summary: Retrieve a workflow spec
      description: Returns the raw YAML spec for an installed workflow.
      parameters:
        - $ref: '#/components/parameters/WorkflowSlugParam'
      responses:
        '200':
          description: Raw workflow spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowGetResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /defaults:
    get:
      tags: [Tasks]
      operationId: getDefaults
      summary: Get the task defaults
      description: >
        The harness, model and owner a new task gets when it leaves them empty (ADR 0009), after
        the config file's `defaults:` and AGC_DEFAULT_HARNESS, AGC_DEFAULT_MODEL and
        AGC_DEFAULT_OWNER; harness and model fall back to built-ins, an unset owner is "".
        `system` is the messaging name agc itself posts as.
      responses:
        '200':
          description: Defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defaults'
        '500':
          $ref: '#/components/responses/Error'
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks
      description: Returns every task, newest first, each with its computed status and its sandboxes.
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                required:
                  - tasks
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: >
        Inserts the task and returns at once. With `sandbox`, a sandbox is allocated after the
        insert, as POST /tasks/{id}/sandboxes does, and comes back `starting`. Missing secrets
        fail before anything is created, naming the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Retrieve a task
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The task with its status and sandboxes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: >
        Deletes every sandbox of the task (stopping it if needed, with its disk and uncommitted
        work), then the task. Volumes and the task's channel history are kept.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The deleted task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTaskResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}/deliver:
    post:
      tags: [Tasks]
      operationId: deliverTask
      summary: Deliver a task for review
      description: >
        Sets `delivered_at`, `summary` and `report` and posts "Delivered: <summary>" in #<task>
        as agc, followed by the report rendered as markdown when there is one (ADR 0010 item 2,
        "Delivery report"). The sandboxes are left as they are; the agent keeps waiting for
        review. A task can be delivered more than once; the last summary and report win, and a
        delivery without a report stores null. Inside a sandbox `agc task deliver` reaches the
        same call over the sandbox's messaging socket, which passes `report` through unchanged.
        `files` carries the PNG of each of the report's `shots` under its label; agc keeps them
        under its home, served by GET /tasks/{id}/shots/{label}.png, and a delivery without
        shots removes the earlier ones. 400 when the report breaks a rule, including a `criteria` count that does not match the
        task's `accept`; 409 when the task is done.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverTaskRequest'
      responses:
        '200':
          description: The task, now `review`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}/shots/{label}.png:
    get:
      tags: [Tasks]
      operationId: getTaskShot
      summary: Get a delivered screenshot
      description: >
        The PNG a delivery sent for the report's shot `label`, kept on the agc host under
        `<agc home>/shots/<task>/<label>.png` (ADR 0010, "Delivery report"). Each delivery
        replaces the task's shots; a reject or an accept keeps them. 404 when the task or the
        shot is absent.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
        - name: label
          in: path
          required: true
          description: The shot's label, a slug such as `before` or `after`.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,62}$'
      responses:
        '200':
          description: The screenshot.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}/accept:
    post:
      tags: [Tasks]
      operationId: acceptTask
      summary: Accept a task
      description: >
        Sets `done_at` and `accepted_by`, posts "Accepted by <name>." in #<task> as agc, then
        stops every running sandbox of the task as POST /sandboxes/{id}/stop does, and every
        starting one as soon as its boot finishes, keeping its disk; a sandbox that cannot be
        stopped is logged and does not fail the accept (ADR 0010 item 4).
        Nothing is deleted, and a stopped sandbox can be started again. A task already done is
        returned as it is. The body is optional. `/accept` posted in #<task> by the manager or
        the owner, and `/accept <task>` posted by the owner in #<owner>, do the same. The first
        accept publishes `task.done` on GET /events, and each sandbox it stops `sandbox.status`.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptTaskRequest'
      responses:
        '200':
          description: The task, now `done`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}/reject:
    post:
      tags: [Tasks]
      operationId: rejectTask
      summary: Send a delivered task back
      description: >
        Clears `delivered_at`, keeps `summary`, and posts "Rejected by <name>: <why>" in #<task>
        as agc, which the agent takes as its next turn (ADR 0010 item 5). `/reject <why>` posted
        in #<task> by the manager or the owner does the same. 409 when the task is done.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTaskRequest'
      responses:
        '200':
          description: The task, back to `running` or `open`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}/sandboxes:
    post:
      tags: [Sandboxes]
      operationId: allocateSandbox
      summary: Allocate compute to a task
      description: >
        Inserts a sandbox and returns it `starting`. The first sandbox of a task is named after
        it, later ones `<task>-2`, `<task>-3`. In the background agc creates the VM, clones the
        repo, answers the harnesses' first-run prompts, writes /home/agent/TASK.md (title, brief,
        "Accepted when" with the task's criteria, and the instructions to push a branch
        `agc/<task>`, post in `#<task>` and end with `agc task deliver`), runs setup, sets
        `booted_at`, then starts `command` as the first terminal. A failure sets `failed` with
        `status_error` and removes the VM. Missing secrets fail before anything is created.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxRequest'
      responses:
        '201':
          description: The sandbox, `starting`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes:
    get:
      tags: [Sandboxes]
      operationId: listSandboxes
      summary: List sandboxes
      description: >
        Returns every sandbox, newest first, each with its task and status. `work` is null
        unless `work=1` asks for it, since checking runs git in every running sandbox.
      parameters:
        - name: work
          in: query
          required: false
          description: 1 to check each running clone for unpushed work.
          schema:
            type: string
            enum: ['1', 'true']
      responses:
        '200':
          description: Sandboxes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandboxes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sandbox'
                required:
                  - sandboxes
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/gc:
    post:
      tags: [Sandboxes]
      operationId: gcSandboxes
      summary: Collect the sandboxes of done tasks
      description: >
        Deletes, through the same path as DELETE /sandboxes/{id}, every sandbox that is stopped,
        is not an agent's home and belongs to a task done longer than keep ago; with dry_run only
        lists them. Volumes and messages are kept. agc rest runs the same collection every 10
        minutes with keep_done (ADR 0008 "Garbage collection"). A failed delete is listed with
        its error and the rest go on.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxGCRequest'
      responses:
        '200':
          description: What was deleted, or would be.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxGCResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}:
    get:
      tags: [Sandboxes]
      operationId: getSandbox
      summary: Retrieve a sandbox
      description: The sandbox with its status and, when it is running and has a repo, the work in its clone.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
      responses:
        '200':
          description: The sandbox with its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Sandboxes]
      operationId: deleteSandbox
      summary: Delete a sandbox
      description: >
        Cancels a boot in progress, stops the VM if needed and removes it with its disk (including
        /home/agent) and uncommitted work. Volumes, among them the sandbox's own volume with the
        harness transcripts, and the task's channel history are kept.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
      responses:
        '200':
          description: The deleted sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSandboxResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/stop:
    post:
      tags: [Sandboxes]
      operationId: stopSandbox
      summary: Stop a sandbox
      description: >
        Shuts the VM down and keeps its disk. The status becomes `stopped`. Refused (409) while
        the sandbox is `starting` or `failed`.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
      responses:
        '200':
          description: The sandbox with its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/start:
    post:
      tags: [Sandboxes]
      operationId: startSandbox
      summary: Start a stopped sandbox
      description: >
        Boots the VM from its disk with secrets read again from the secrets file. Refused (409)
        while the sandbox is `starting` or `failed`.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
      responses:
        '200':
          description: The sandbox with its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/terminals:
    get:
      tags: [Sandboxes]
      operationId: listTerminals
      summary: List a sandbox's terminals
      description: The sandbox's jobs as the runtime reports them.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
      responses:
        '200':
          description: Terminals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  terminals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Terminal'
                required:
                  - terminals
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Sandboxes]
      operationId: startTerminal
      summary: Start a terminal
      description: Starts a TTY job in the sandbox that outlives the request and the browser tab.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTerminalRequest'
      responses:
        '200':
          description: The new terminal's job id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/terminals/{job}/ws:
    get:
      tags: [Sandboxes]
      operationId: attachTerminal
      summary: Attach to a terminal over WebSocket
      description: >
        Upgrades to a WebSocket. Binary frames carry terminal bytes both ways; a text frame
        {"type":"resize","rows":N,"cols":N} resizes. Recent output is replayed first. The socket
        closes normally with reason "job completed" when the program exits; closing it detaches
        and the job keeps running.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
        - name: job
          in: path
          required: true
          description: Terminal job id.
          schema:
            type: string
      responses:
        '101':
          description: Switching to the WebSocket protocol.
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts and providers
      description: >
        Every account by provider, then name, with its usage (null until the usage fetcher is
        wired, and for every account that is not anthropic oauth), and every provider with the
        harnesses it serves and the variable each kind of account is handed to. Values are never
        returned.
      responses:
        '200':
          description: Accounts and providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Add an account
      description: >
        Writes ACCOUNT_<NAME>=<value> (name upper-cased, dashes as underscores) to secrets.env,
        mode 0600, created when missing, and inserts the row, not as the default. The value is
        trimmed, quoted as secrets.env reads it, and never returned or logged. 400 for a bad name,
        provider or kind (openai has no oauth kind yet) or an empty value; 409 when the name is
        taken or its secret is already set in secrets.env.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /accounts/{name}:
    parameters:
      - $ref: '#/components/parameters/AccountNameParam'
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account
      description: >
        Removes the row and its secrets.env line. 409 while a running or booting sandbox's spec
        names its secret (a default bound at allocation is recorded in the spec); stop the
        sandbox first.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /accounts/{name}/default:
    parameters:
      - $ref: '#/components/parameters/AccountNameParam'
    post:
      tags: [Accounts]
      operationId: setDefaultAccount
      summary: Make an account its provider's default
      description: >
        The provider's previous default loses the flag in the same transaction. From now on a
        sandbox allocated or started for a harness of this provider, whose spec sets none of the
        variables the harness reads, gets `<secret> as <variable>`.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Accounts]
      operationId: clearDefaultAccount
      summary: Take the default flag off an account
      description: The provider is left with no default; sandboxes get no credential from it.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /accounts/{name}/signin:
    parameters:
      - $ref: '#/components/parameters/AccountNameParam'
    post:
      tags: [Accounts]
      operationId: beginAccountSignin
      summary: Begin signing an account in
      description: >
        ADR 0018 "Sign-in". Starts the OAuth login Claude Code runs, for an anthropic oauth
        account: a random state and a PKCE S256 verifier, kept in memory for 10 minutes, one per
        account (a new one replaces the last). Open `url`; after signing in, the page shows
        `code#state` to paste into `signin/complete`. The login is used only to read usage and
        identity; sandboxes keep the account's own token.
      responses:
        '200':
          description: The page to open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSignin'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Accounts]
      operationId: signoutAccount
      summary: Sign an account out
      description: >
        Removes the account's login line (ACCOUNT_<NAME>_LOGIN) from secrets.env, forgets its access
        token and clears `signed_in_at`; usage is read with the account's own token again.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /accounts/{name}/signin/complete:
    parameters:
      - $ref: '#/components/parameters/AccountNameParam'
    post:
      tags: [Accounts]
      operationId: completeAccountSignin
      summary: Finish signing an account in with the pasted code
      description: >
        Exchanges the pasted code for tokens, writes the refresh token to secrets.env as
        ACCOUNT_<NAME>_LOGIN, keeps the access token in memory, sets `signed_in_at`, reads the
        account's usage at once and sets `email` from the profile when it was empty. Neither token
        nor the code is ever returned or logged. 400 when nothing is pending ("no sign-in pending
        for this account; start again"), when the state does not match, or when the token endpoint
        refuses the code (its HTTP status, never its body).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAccountSigninRequest'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List persistent agents
      description: Every agent, oldest first, with its state read from its home now.
      responses:
        '200':
          description: Agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Make a numbered agent from a role
      description: >
        Reads the template agents/<role>.yaml (the role lowercased; 400 when there is none) and
        inserts `<role lowercased>-<n>`, n one more than the highest number ever drawn for that
        role, so a kept agent's number is never handed out again, even after a rename or a role
        change. An empty harness or model takes the template's, then the configured defaults;
        the owner is the default owner (ADR 0009). The agent is asleep with no home.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: The numbered agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/{name}:
    parameters:
      - $ref: '#/components/parameters/AgentNameParam'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get a persistent agent
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Delete a persistent agent
      description: >
        Deletes the home sandbox (its VM and disk), then the row. The home's volume agc-<home>,
        the agent's memory and harness transcripts, is kept, as for every sandbox (ADR 0008), and
        so are its messages and the tasks it managed.
      responses:
        '200':
          description: The deleted agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/{name}/keep:
    parameters:
      - $ref: '#/components/parameters/AgentNameParam'
    post:
      tags: [Agents]
      operationId: keepAgent
      summary: Keep (name or rename) an agent
      description: >
        Sets kept, renames the agent and, with role, changes the template it runs (400 when the
        role has no template). The home sandbox and its volume keep their names: a rename is a
        label, not a move. The tasks it manages follow it to the new name. 409 when another
        agent has the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeepAgentRequest'
      responses:
        '200':
          description: The kept agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/{name}/wake:
    parameters:
      - $ref: '#/components/parameters/AgentNameParam'
    post:
      tags: [Agents]
      operationId: wakeAgent
      summary: Wake an agent
      description: >
        With no home, allocates one from the template's sandbox, named after the agent, with the
        template's instructions as /home/agent/AGENT.md and the job `agent` running
        `agc agent run --agent <name> --harness <h> [--model <m>] --brief /home/agent/AGENT.md`,
        and answers waking while it boots. With a stopped home, starts it. With a home running or
        starting, does nothing. A home that failed to boot is deleted and allocated again; any
        other home status answers 409. A message in a channel the agent reads also wakes it.
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/{name}/sleep:
    parameters:
      - $ref: '#/components/parameters/AgentNameParam'
    post:
      tags: [Agents]
      operationId: sleepAgent
      summary: Put an agent to sleep
      description: >
        Stops the awake agent's home and posts "Asleep." as agc in its inbox
        #<name>. 409 when the agent is not awake.
      responses:
        '200':
          description: The agent, asleep.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: List schedules
      description: Every schedule, by name.
      responses:
        '200':
          description: Schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleList'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Create a schedule
      description: >
        Stores the schedule without running it; the scheduler runs it on its next check (every
        30s), as a schedule that never ran is due at once. The template is rendered with every
        item field it reads set to "sample" (with a poll) and must pass the same defaults and
        validation as POST /tasks, else 400. 409 when the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '200':
          description: The created schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /schedules/{id}:
    get:
      tags: [Schedules]
      operationId: getSchedule
      summary: Retrieve a schedule
      parameters:
        - $ref: '#/components/parameters/ScheduleIdParam'
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Replace a schedule
      description: >
        Replaces every, enabled, task and poll; the name stays, and so do last_run_at and the
        items, so keys already seen still create nothing. Omitted enabled is true, omitted poll
        removes the poll. Validated as on create.
      parameters:
        - $ref: '#/components/parameters/ScheduleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      summary: Delete a schedule
      description: Deletes the schedule and its items. The tasks it created are kept.
      parameters:
        - $ref: '#/components/parameters/ScheduleIdParam'
      responses:
        '200':
          description: The deleted schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteScheduleResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /schedules/{id}/run:
    post:
      tags: [Schedules]
      operationId: runSchedule
      summary: Run a schedule now
      description: >
        Ticks the schedule now, enabled or not and due or not, and answers once the tick ends.
        Without a poll it creates one task; with one it runs the command on the host (sh -c, 60s
        timeout, only PATH, HOME and the named secrets in its environment), reads its stdout as
        JSON lines, and creates a task for each key not seen before, exactly as POST /tasks does.
        A failed tick answers 200 with error set (also the schedule's last_error); a failing
        command or bad output creates nothing. 409 while another tick of the schedule runs.
      parameters:
        - $ref: '#/components/parameters/ScheduleIdParam'
      responses:
        '200':
          description: The tick.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleRunResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /schedules/{id}/items:
    get:
      tags: [Schedules]
      operationId: listScheduleItems
      summary: List the items a schedule has seen
      description: >
        One item per key, newest first, with the task created for it. Without a poll the key is
        the created task's name.
      parameters:
        - $ref: '#/components/parameters/ScheduleIdParam'
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItemList'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/transcripts:
    get:
      tags: [Sandboxes]
      operationId: listTranscripts
      summary: List a sandbox's harness transcripts
      description: >
        The Claude Code and Codex session files (.claude/projects/**/*.jsonl,
        .codex/sessions/**/*.jsonl) on the sandbox's volume, newest first. Read on the host side
        of the volume, never through the VM, so it works for stopped sandboxes and, by name, for
        deleted ones whose volume is left. Links are not listed.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
      responses:
        '200':
          description: Transcripts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptList'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/transcripts/{path}:
    get:
      tags: [Sandboxes]
      operationId: getTranscript
      summary: Stream one harness transcript
      description: >
        Streams one transcript as JSON Lines from the host side of the sandbox's volume (Range
        requests supported). path is a listed path, relative to the volume and under
        .claude/projects/ or .codex/sessions/; its slashes are path separators. A path with
        "..", "." or empty segments is refused (400), and so is anything but a regular file.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
        - name: path
          in: path
          required: true
          description: Transcript path relative to the volume, as listed.
          schema:
            type: string
      responses:
        '200':
          description: The transcript.
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/turns:
    get:
      tags: [Sandboxes]
      operationId: listSandboxTurns
      summary: List a sandbox's turns
      description: >
        The turns of the harness sessions on the sandbox's volume, newest first, read the way
        GET /agents/{name}/turns reads an agent's, so a finished task's reasoning can be read
        after its sandbox is stopped or deleted.
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
        - name: limit
          in: query
          description: How many turns, newest first.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: before
          in: query
          description: Only turns with n below this, for the next page.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Turns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnList'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sandboxes/{id}/turns/{n}:
    get:
      tags: [Sandboxes]
      operationId: getSandboxTurn
      summary: Get one of a sandbox's turns
      parameters:
        - $ref: '#/components/parameters/SandboxIdParam'
        - $ref: '#/components/parameters/TurnNumberParam'
      responses:
        '200':
          description: The turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/{name}/turns:
    get:
      tags: [Agents]
      operationId: listAgentTurns
      summary: List an agent's turns
      description: >
        The turns of every harness session on the agent's volume agc-<name> (Claude Code
        .claude/projects/**/*.jsonl, Codex .codex/sessions/**/*.jsonl), newest first, read from
        the host side of the volume on every request; agc keeps no copy. A turn starts at a user
        message that is not a tool result; n numbers them from 1 across all sessions by start
        time. channel and thread come from the agent loop's agc-sessions.json when it names the
        session. 404 when the volume does not exist.
      parameters:
        - $ref: '#/components/parameters/AgentNameParam'
        - name: limit
          in: query
          description: How many turns, newest first.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: before
          in: query
          description: Only turns with n below this, for the next page.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Turns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnList'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/{name}/turns/{n}:
    get:
      tags: [Agents]
      operationId: getAgentTurn
      summary: Get one of an agent's turns
      description: >
        The whole turn: the text injected, each tool call with its arguments and result (cut to
        4 KB), the final answer, and the token counts when the transcript has them.
      parameters:
        - $ref: '#/components/parameters/AgentNameParam'
        - $ref: '#/components/parameters/TurnNumberParam'
      responses:
        '200':
          description: The turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /specs:
    get:
      tags: [Tasks]
      operationId: listSavedSpecs
      summary: List saved specs
      description: >
        Saved specs are reusable sandbox specs in ~/.agent_composer/config/specs/<name>.yaml,
        sorted by name.
      responses:
        '200':
          description: Saved specs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  specs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedSpec'
                required:
                  - specs
        '500':
          $ref: '#/components/responses/Error'
  /specs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Saved spec name.
        schema:
          type: string
    get:
      tags: [Tasks]
      operationId: getSavedSpec
      summary: Retrieve a saved spec
      responses:
        '200':
          description: The saved spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Tasks]
      operationId: saveSpec
      summary: Save a spec
      description: >
        Validates the YAML as a sandbox spec and stores it verbatim, comments included, replacing a
        saved spec of the same name. The name may be free text; it is saved as its slug
        ("Backend review" becomes backend-review), which the response returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - yaml
              properties:
                yaml:
                  type: string
                  description: The sandbox spec, the sandbox block of a task.yaml at top level.
      responses:
        '200':
          description: The saved spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSpec'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Tasks]
      operationId: deleteSavedSpec
      summary: Delete a saved spec
      responses:
        '200':
          description: The deleted spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /secrets:
    get:
      tags: [Tasks]
      operationId: listSecrets
      summary: List secret names
      description: >
        Names in ~/.agent_composer/config/secrets.env, sorted, each with the hosts it is bound to
        by default (empty for names agc does not know, which a spec must bind as NAME@host).
        Values are never returned (ADR 0004). A missing file lists nothing; a file readable by
        anyone but its owner is refused. harnesses lists the variables each harness reads, the
        ENV side of a NAME as ENV account entry.
      responses:
        '200':
          description: Secret names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Secret'
                  harnesses:
                    type: array
                    description: >
                      Every harness in the catalog with the environment variables it takes its
                      credentials from, in order of preference, so a client can offer "use this
                      secret as the variable claude_code reads" (a NAME as ENV entry, ADR 0004
                      "Accounts").
                    items:
                      $ref: '#/components/schemas/HarnessReads'
                required:
                  - secrets
                  - harnesses
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List the skills in the skills repository
      description: >
        The directories of the skills directory (~/.agent_composer/skills, or AGC_SKILLS_DIR)
        whose name is a slug, sorted, read on every request. A missing directory lists nothing.
      responses:
        '200':
          description: The skills.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
        '500':
          $ref: '#/components/responses/Error'
  /skills/{name}:
    get:
      tags: [Skills]
      operationId: getSkill
      summary: Read a skill's SKILL.md
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The skill's SKILL.md, as it is on disk.
          content:
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge:
    get:
      tags: [Knowledge]
      operationId: listKnowledge
      summary: List evidence, beliefs, decisions, rules and actions
      description: >
        Loads evidence/, beliefs/, decisions/, rules/, actions/, proposals/ and gates/ under the knowledge directory
        (~/.agent_composer/knowledge, or AGC_KNOWLEDGE_DIR) on every request, so edits show
        live. A missing directory lists nothing. A file that does not validate is a 400 whose
        message is the validation error, naming the file and the id.
      parameters:
        - name: without
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated evidence and belief ids. Everything is judged as if those were
            retracted or absent (a what-if; nothing is written), and the ids are echoed in
            `without`. An id that is not loaded evidence or a belief is a 404.
      responses:
        '200':
          description: Everything in the knowledge directory, in load order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge/why/{id}:
    get:
      tags: [Knowledge]
      operationId: knowledgeWhy
      summary: Follow a belief, decision, rule or action down to its evidence
      parameters:
        - $ref: '#/components/parameters/KnowledgeIdParam'
      responses:
        '200':
          description: >
            The node, the evidence it cites, what it rests on and its alternative sets of
            reasons, each a tree of Reasons down to the evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reason'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge/doubt/{id}:
    get:
      tags: [Knowledge]
      operationId: knowledgeDoubt
      summary: List what rests on a belief, decision, rule or piece of evidence
      description: >
        Everything that falls if the belief, decision, rule or evidence is wrong, directly or
        through other beliefs and decisions, and apart, in `standing`, what rests on it but
        still stands on another set of reasons. Only open actions are listed. Nothing rests on
        a rule, so its listing is empty. Nothing is changed.
      parameters:
        - $ref: '#/components/parameters/KnowledgeIdParam'
      responses:
        '200':
          description: What rests on the id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doubted'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge/conflicts:
    get:
      tags: [Knowledge]
      operationId: knowledgeConflicts
      summary: List contested contradictions
      description: >
        Every contradiction where at least one side is contested, in the order declared, with
        the live evidence and opinions each side rests on. No side is picked.
      responses:
        '200':
          description: The contested contradictions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeConflictSet'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Stream live events
      description: >
        Server-sent events (`text/event-stream`, `Cache-Control: no-cache`) until the client goes
        away. Each event is `id: <n>` (the event number), `event: <type>` and `data: <json>`; the
        server sends the comment `: ping` every 20 seconds as a heartbeat. Missed events are never
        replayed: after a reconnect, refetch. A client that falls too far behind is disconnected.
        Types and their data:
        `task.created` (TaskCreatedEvent) when a task is created, after its sandbox, if any, is
        allocated;
        `task.done` (TaskDoneEvent) when a task is accepted, the first time only;
        `sandbox.status` (SandboxStatusEvent) on every status change: allocated (starting),
        booted, failed, stopped (by POST /sandboxes/{id}/stop or by the task's accept, also
        right after a boot that finished once the task was accepted), started, and deleted
        (status `deleted`);
        `message.posted` (MessagePostedEvent) for every message stored in any channel, agc's
        included;
        `schedule.ran` (ScheduleRanEvent) after every tick of a schedule, by the scheduler or
        POST /schedules/{id}/run, failed ones included (see the schedule's last_error);
        `agent.state` (AgentStateEvent) on every status change of a persistent agent's home
        (as its sandbox.status), and when the agent is created, kept, woken for the first time
        and deleted (state `deleted`);
        `channel.archived` (ChannelArchivedEvent) when agc rest archives the channel of a task
        done longer than archive_done ago (ADR 0005 "Archived channels").
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Frames as described above; each data is one of the event schemas
                  (TaskCreatedEvent, TaskDoneEvent, SandboxStatusEvent, MessagePostedEvent, ScheduleRanEvent,
                  AgentStateEvent, ChannelArchivedEvent).
        '500':
          $ref: '#/components/responses/Error'
  /msg/post:
    post:
      tags: [Messaging]
      operationId: postMessage
      summary: Post a message or a question
      description: >
        Appends a message to a channel as the given participant, which must belong to the caller;
        agc fills in `from`, `task` and `human`. `kind` is `message` (the default) or `question`;
        anything else is 400. A reply (`reply_to`) to a question from someone other than its
        asker answers it. Inside a sandbox `agc msg post` and `agc msg ask` reach the same call
        over the sandbox's socket, limited to the task's channels. A post may carry up to 4
        `images` (PNG, JPEG, GIF or WebP, sniffed from the bytes, at most 5 MB each; the body
        may then be empty), kept on the agc host under `<agc home>/images/<message id>/<name>`
        and listed on the message with their URLs (ADR 0005 "Images"); `agc msg post --image
        <file>` sends them. The request body is at most 28 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MsgPostRequest'
      responses:
        '200':
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgMessage'
        '400':
          $ref: '#/components/responses/MsgError'
        '401':
          $ref: '#/components/responses/MsgError'
        '404':
          $ref: '#/components/responses/MsgError'
        '500':
          $ref: '#/components/responses/MsgError'
  /msg/images/{id}/{name}:
    get:
      tags: [Messaging]
      operationId: getMessageImage
      summary: Get a message's image
      description: >
        One of the images a message carries, as it was posted, with its type (ADR 0005
        "Images"; `messages.API.OpenImage`). The `url` of each of a message's `images` points
        here. A sandbox reads the same image at `/images/{id}/{name}` on its socket, only for
        messages in channels it may read (403 otherwise, as messaging errors). 404 when the
        message or the image is absent.
      parameters:
        - name: id
          in: path
          required: true
          description: The message's id.
          schema:
            type: integer
            format: int64
        - name: name
          in: path
          required: true
          description: The image's stored name, as the message lists it.
          schema:
            type: string
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /msg/wait:
    get:
      tags: [Messaging]
      operationId: waitMessages
      summary: Wait for messages in one or several channels
      description: >
        Blocks until a channel named in `channel` or `channels` has a message with an id greater
        than `after`, or the timeout passes, and returns every such message from all of them in id
        order (message ids are global, so one cursor serves them all; ADR 0016). An empty list
        means the timeout passed. The caller must be allowed to read every channel named, or the
        whole wait is refused. Inside a sandbox this is the socket's `GET /wait`, which
        `agc msg wait` and `agc agent run --agent` call; `GET /read` takes the same channel
        parameters and does not block.
      parameters:
        - name: channel
          in: query
          description: One channel, e.g. `#fix-login`.
          schema:
            type: string
        - name: channels
          in: query
          description: Comma-separated channels, read together with `channel`.
          schema:
            type: string
        - name: after
          in: query
          description: Only messages with an id greater than this; 0 or absent for all.
          schema:
            type: integer
            format: int64
        - name: timeout
          in: query
          description: How long to block, a Go duration such as `30s` (default 30s).
          schema:
            type: string
        - name: participant
          in: query
          description: The waiting participant's id, marked as seen while it waits.
          schema:
            type: string
      responses:
        '200':
          description: The messages after the cursor, oldest first, and the cursor to pass next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgMessagesResponse'
        '400':
          $ref: '#/components/responses/MsgError'
        '403':
          $ref: '#/components/responses/MsgError'
        '500':
          $ref: '#/components/responses/MsgError'
  /msg/questions:
    get:
      tags: [Messaging]
      operationId: listQuestions
      summary: List questions and whether they are answered
      description: >
        Messages of kind `question`, newest first, at most 500. Each carries its answer, the first
        reply to it from someone other than the asker (by participant and by name), computed on
        every request and never stored; `answer_id`, `answered_by` and `answered_at` are null
        while it is open. A sandbox sees only its task's channels.
      parameters:
        - name: channel
          in: query
          description: Only questions in this channel, e.g. `#fix-login`.
          schema:
            type: string
        - name: open
          in: query
          description: '`1` keeps only unanswered questions; `0` or absent keeps all.'
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
        - name: for
          in: query
          description: >
            Only questions in the channels this person reads: their inbox `#<name>` and `#<task>`
            for every task they manage (not those they only own; a task's manager raises to its
            owner in their inbox).
          schema:
            type: string
      responses:
        '200':
          description: The questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgQuestionsResponse'
        '400':
          $ref: '#/components/responses/MsgError'
        '401':
          $ref: '#/components/responses/MsgError'
        '500':
          $ref: '#/components/responses/MsgError'
  /msg/participants:
    get:
      tags: [Messaging]
      operationId: listMsgParticipants
      summary: List the participants of a channel, or everyone, with presence
      description: >
        Everyone who has posted in the channel: active ones first, then those who left, each by
        name. Poll it with the channel to keep presence current; nothing is published. With
        all=1 (humans only, 403 for a task) it lists everyone who ever joined, in any channel or
        none, in the same order, and ignores channel.
      parameters:
        - name: channel
          in: query
          required: false
          description: The channel, such as '#review-42'. Required unless all=1.
          schema:
            type: string
        - name: all
          in: query
          required: false
          description: 1 lists every participant ever joined instead of one channel's.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: The channel's participants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgParticipantList'
        '400':
          $ref: '#/components/responses/MsgError'
        '403':
          $ref: '#/components/responses/MsgError'
  /msg/participants/{id}:
    get:
      tags: [Messaging]
      operationId: getMsgParticipant
      summary: Get one participant, with presence
      parameters:
        - name: id
          in: path
          required: true
          description: The participant id agc handed out on join.
          schema:
            type: string
      responses:
        '200':
          description: The participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgParticipant'
        '404':
          $ref: '#/components/responses/MsgError'
components:
  parameters:
    AccountNameParam:
      name: name
      in: path
      required: true
      description: Account name, e.g. work.
      schema:
        type: string
    AgentNameParam:
      name: name
      in: path
      required: true
      description: Agent name, e.g. reviewer-1.
      schema:
        type: string
    TurnNumberParam:
      name: n
      in: path
      required: true
      description: Turn number, from 1.
      schema:
        type: integer
        minimum: 1
    LimitParam:
      name: limit
      in: query
      description: >
        Maximum number of records to return. Defaults to 50 and is capped at 1000 by the service.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    CursorParam:
      name: cursor
      in: query
      description: >
        Base64 encoded cursor returned by a previous page. Supply it to fetch the next page.
      schema:
        type: string
    SearchParam:
      name: search
      in: query
      description: Case-insensitive substring search applied to resource-specific fields.
      schema:
        type: string
    AgentSpecIdParam:
      name: id
      in: path
      required: true
      description: Agent spec identifier.
      schema:
        type: string
        format: uuid
    ConversationIdParam:
      name: id
      in: path
      required: true
      description: Conversation identifier.
      schema:
        type: string
        format: uuid
    HookIdParam:
      name: id
      in: path
      required: true
      description: Hook identifier.
      schema:
        type: string
        format: uuid
    WorkflowSlugParam:
      name: slug
      in: path
      required: true
      description: Workflow slug — the human-facing handle from the registry.
      schema:
        type: string
    TaskIdParam:
      name: id
      in: path
      required: true
      description: Task UUID or task name. A value that parses as a UUID is looked up by id.
      schema:
        type: string
    ScheduleIdParam:
      name: id
      in: path
      required: true
      description: Schedule UUID or schedule name. A value that parses as a UUID is looked up by id.
      schema:
        type: string
    SandboxIdParam:
      name: id
      in: path
      required: true
      description: Sandbox UUID or sandbox name. A value that parses as a UUID is looked up by id.
      schema:
        type: string
    KnowledgeIdParam:
      name: id
      in: path
      required: true
      description: >
        A belief, decision, rule or action id for why; a belief, decision, rule or evidence id
        for doubt.
      schema:
        type: string
  responses:
    Error:
      description: Error response with machine-readable code and request identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MsgError:
      description: Messaging error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MsgErrorResponse'
  schemas:
    Defaults:
      type: object
      properties:
        harness:
          type: string
          description: Default harness id, e.g. claude_code.
        model:
          type: string
          description: Default model.
        owner:
          type: string
          description: Default owner, "" when unset.
        system:
          type: string
          description: The participant agc posts as (agc).
      required:
        - harness
        - model
        - owner
        - system
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/StandardError'
      required:
        - error
    StandardError:
      type: object
      properties:
        code:
          type: string
          description: Application error code (e.g., EINVALID, ENOTFOUND).
        message:
          type: string
          description: Human-readable error message.
        request_id:
          type: string
          description: Correlation identifier logged by the server.
      required:
        - code
        - message
        - request_id
    CursorPage:
      type: object
      properties:
        next_cursor:
          type: string
          description: Cursor to fetch the next page, omitted if there is no next page.
        has_next_page:
          type: boolean
          description: Indicates whether another page exists.
        hash:
          type: string
          description: SHA-256 hash of the returned items for cache validation.
      required:
        - has_next_page
    AgentSpec:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        harness:
          $ref: '#/components/schemas/Harness'
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffort'
        instructions:
          type: string
        auto_compact:
          type: boolean
        compact_at_percent:
          type: integer
          minimum: 1
          maximum: 100
        compaction_prompt:
          type: string
        shell_access:
          type: boolean
        web_search:
          type: boolean
        structured_output:
          type: boolean
        structured_output_schema:
          type: object
          additionalProperties: true
          nullable: true
        version:
          type: integer
      required:
        - id
        - name
        - harness
        - model
        - reasoning_effort
        - instructions
        - auto_compact
        - compact_at_percent
        - shell_access
        - web_search
        - structured_output
        - version
    AgentSpecListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            agent_specs:
              type: array
              items:
                $ref: '#/components/schemas/AgentSpec'
          required:
            - agent_specs
    CreateAgentSpecRequest:
      type: object
      required:
        - name
        - harness
        - model
        - instructions
      properties:
        name:
          type: string
        harness:
          $ref: '#/components/schemas/Harness'
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
          description: >
            Harness-specific configuration. The access tier is set with the shared
            `permissions` field (`read_only` default, `exec`, or `dangerously-exec`) and works
            the same for every harness. For `codex_cli` other fields may include `profile`,
            `skip_git_repo_check`, `ephemeral`, `add_dirs`, and `config_overrides`. For
            `claude_code` other fields may include `allowed_tools`, `disallowed_tools`,
            `add_dirs`, `mcp_config`, `tools`, `settings`, `system_prompt`,
            `append_system_prompt`, `verbose`, and `strict_mcp_config`. Claude Code workflow
            agents always run with `--bare`; this behavior cannot be disabled through harness
            configuration.
        instructions:
          type: string
      description: >
        Creates a harness-backed agent spec. Legacy provider/self-harness request fields are no
        longer part of this contract.
    UpdateAgentSpecRequest:
      type: object
      properties:
        agent_spec_id:
          type: string
          format: uuid
          readOnly: true
          description: Filled from the path parameter; omit in the payload.
        harness:
          $ref: '#/components/schemas/Harness'
        name:
          type: string
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
        instructions:
          type: string
      description: >
        Supply at least one mutable field; otherwise the service returns EINVALID. Legacy
        provider/self-harness fields are no longer part of this contract.
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_spec_id:
          type: string
          format: uuid
        session_id:
          type: string
          nullable: true
        project_dir:
          type: string
          nullable: true
          description: Optional project directory for the harness process.
        agent_name:
          type: string
        harness:
          $ref: '#/components/schemas/Harness'
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
        harness_session_ref:
          type: string
          nullable: true
          description: Harness-native session or thread identifier used for resume.
        harness_state:
          $ref: '#/components/schemas/JSONValue'
        raw_harness_output:
          type: string
          description: Raw machine-readable output captured from the harness, if available.
        harness_exit_code:
          type: integer
          description: Most recent harness process exit code.
        harness_error:
          type: string
          nullable: true
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffort'
        instructions:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        status:
          $ref: '#/components/schemas/ConversationStatus'
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_tokens:
          type: integer
        cost:
          type: integer
          description: Tracked cost in the smallest billing unit known to the service.
        created_at:
          type: string
          format: date-time
        auto_compact:
          type: boolean
        compact_at_percent:
          type: integer
        compaction_prompt:
          type: string
        compact_count:
          type: integer
        shell_access:
          type: boolean
        web_search:
          type: boolean
        structured_output:
          type: boolean
        structured_output_schema:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - id
        - agent_spec_id
        - agent_name
        - harness
        - model
        - harness_exit_code
        - reasoning_effort
        - instructions
        - messages
        - status
        - input_tokens
        - output_tokens
        - cached_tokens
        - cost
        - created_at
        - auto_compact
        - compact_at_percent
        - compact_count
        - shell_access
        - web_search
        - structured_output
    Message:
      type: object
      properties:
        Role:
          $ref: '#/components/schemas/MessageRole'
        Content:
          type: string
        Name:
          type: string
        ToolCallID:
          type: string
        ToolCall:
          $ref: '#/components/schemas/ToolCall'
          nullable: true
    ToolCall:
      type: object
      properties:
        Name:
          type: string
        CallID:
          type: string
        Arguments:
          type: string
          description: Raw JSON arguments returned by the model.
        JSONArguments:
          $ref: '#/components/schemas/JSONValue'
          description: Raw JSON value mirrored from `Arguments` (object, array, or scalar).
      additionalProperties: false
    ConversationListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            conversations:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'
          required:
            - conversations
    CreateConversationRequest:
      type: object
      required:
        - agent_spec_id
        - prompt
      properties:
        agent_spec_id:
          type: string
          format: uuid
        prompt:
          type: string
        parallel_conversations:
          type: integer
          minimum: 1
          default: 1
          description: Number of conversation instances to launch in parallel. Values <1 default to 1.
        session_id:
          type: string
          description: Optional client-provided identifier for logical sessions.
        project_dir:
          type: string
          nullable: true
          description: Optional project directory for the harness process.
        metadata:
          type: object
          additionalProperties: true
          nullable: true
    UpdateConversationRequest:
      type: object
      required:
        - metadata
      properties:
        metadata:
          type: object
          additionalProperties: true
          nullable: false
          description: JSON object to replace metadata; send {} to clear.
    ConversationCreateResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
            required:
              - id
      required:
        - conversations
    ForkConversationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: Prompt to send to the forked conversation.
    ResumeConversationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: Prompt to resume the conversation with.
    Hook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/HookEventType'
        agent_name:
          type: string
          description: Empty string represents a wildcard hook.
        command:
          type: string
        args:
          type: array
          items:
            type: string
        enabled:
          type: boolean
      required:
        - id
        - event_type
        - agent_name
        - command
        - args
        - enabled
    HookListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            hooks:
              type: array
              items:
                $ref: '#/components/schemas/Hook'
          required:
            - hooks
    WorkflowSummary:
      type: object
      properties:
        slug:
          type: string
          description: Human-facing handle — renameable.
        id:
          type: string
          format: uuid
          description: Permanent workflow identity.
        name:
          type: string
        version:
          type: string
        description:
          type: string
        has_draft:
          type: boolean
        draft_only:
          type: boolean
        inputs:
          type: object
          additionalProperties:
            type: string
        outputs:
          type: object
          additionalProperties:
            type: string
      required:
        - slug
        - name
        - inputs
        - outputs
    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSummary'
      required:
        - workflows
    WorkflowGetResponse:
      type: object
      properties:
        workflow_slug:
          type: string
        spec:
          type: string
          description: Raw workflow YAML spec.
        draft:
          type: string
          description: Unsaved proposed spec, when one exists.
      required:
        - workflow_slug
        - spec
    TaskSpec:
      type: object
      description: >
        The environment block a sandbox boots from (ADR 0003): the sandbox block of a task.yaml
        without command. Secrets are names only, never values.
      properties:
        image:
          type: string
          description: OCI image, default agc-agent.
        cpus:
          type: integer
        memory:
          type: integer
          description: MiB.
        disk:
          type: string
          description: >
            Size of /home/agent, a private ext4 disk removed with the sandbox: a whole number
            followed by M, G or T, such as 10G. Default 20G, minimum 2G.
        repo:
          type: string
          description: host/owner/name or an https URL, cloned to /home/agent/<name>.
        ref:
          type: string
          description: Branch, tag or commit checked out after the clone.
        setup:
          type: string
          description: Bash script run once after the clone, in the repo. Before it runs, agc marks the Claude Code and Codex first-run prompts (onboarding, theme, folder trust, bypass permissions) as answered.
        secrets:
          type: array
          items:
            type: string
          description: >
            NAME, NAME@host1,host2, or an account, NAME as ENV[@host1,host2]: NAME is the entry
            in secrets.env and ENV ([A-Z_][A-Z0-9_]*) the guest variable it is handed to, such as
            ANTHROPIC_WORK as CLAUDE_CODE_OAUTH_TOKEN. Without as, ENV is NAME. Hosts come from the
            entry, else the hosts agc knows for ENV, else those for NAME. An account may not share
            its ENV with another entry. The guest holds a placeholder, never the value (ADR 0004).
        env:
          type: object
          additionalProperties:
            type: string
        volumes:
          type: array
          items:
            type: string
          description: NAME:DEST[:rw] or host:PATH:DEST[:rw].
        channels:
          type: array
          items:
            type: string
          description: '#name or #name:read.'
        skills:
          type: array
          items:
            type: string
          description: >
            Names of skills in agc's skills repository (GET /skills). Each is written into
            ~/.claude/skills/<name>/ and ~/.codex/skills/<name>/ on every boot and start,
            replacing what was there; a name that is not in the repository is refused before
            boot (ADR 0008 "Skills").
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: What a human calls the task.
        name:
          type: string
          description: Slug, also the task's channel and its first sandbox's name.
        brief:
          type: string
          description: What to do and what done looks like, markdown.
        accept:
          type: array
          description: >
            What accepted means, in order: criteria agc shows in TASK.md under "Accepted when" and
            does not evaluate (ADR 0010 item 1). Always an array, possibly empty.
          items:
            type: string
        assignee:
          type: string
          description: A harness id (claude_code, codex_cli) or a person's name; empty is unassigned.
        model:
          type: string
          description: The harness model when the assignee is a harness, empty for a person (ADR 0009).
        manager:
          type: string
          description: Messaging name of whoever created the task and runs it day to day.
        owner:
          type: string
          description: The human the task answers to; empty when no owner is set.
        for:
          type: string
          description: Id of the knowledge action or decision the task serves; empty for none.
        notify:
          type: boolean
          description: >
            The panel shows a toast and plays a chime when the task starts (task.created) and when
            it is done (task.done).
        status:
          type: string
          enum: [open, running, review, done]
          description: >
            Computed: done when done_at is set, otherwise review when delivered_at is set,
            otherwise running when a sandbox is running, otherwise open (ADR 0010 item 3).
        done_at:
          type: string
          format: date-time
          nullable: true
          description: When the task was accepted.
        accepted_by:
          type: string
          description: Who accepted the task; empty until accepted.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: When the agent last delivered; null before a delivery and after a rejection.
        summary:
          type: string
          description: The last delivery's summary, kept after a rejection.
        report:
          allOf:
            - $ref: '#/components/schemas/DeliveryReport'
          nullable: true
          description: >
            The last delivery's report, null when it sent none; kept after a rejection (ADR 0010,
            "Delivery report").
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sandboxes:
          type: array
          description: The task's sandboxes, newest first.
          items:
            $ref: '#/components/schemas/Sandbox'
      required:
        - id
        - title
        - name
        - brief
        - accept
        - assignee
        - model
        - manager
        - owner
        - for
        - notify
        - status
        - done_at
        - accepted_by
        - delivered_at
        - summary
        - report
        - created_at
        - updated_at
        - sandboxes
    CreateTaskRequest:
      type: object
      description: >
        At least one of title or name is required. brief is required unless sandbox is set.
        manager is required (400 "manager is required" without it). An empty assignee, model or
        owner gets the configured default (ADR 0009). On create agc posts the opening message in
        #<name> as agc, then the sandbox's instructions when a sandbox was requested.
      required:
        - manager
      properties:
        title:
          type: string
          description: Up to 120 characters. Defaults to the name.
        name:
          type: string
          description: >
            1-63 lowercase letters, digits or -, starting with a letter, and not a UUID. Defaults
            to the title's slug ("Review facebook ads" becomes review-facebook-ads).
        brief:
          type: string
        accept:
          type: array
          description: >
            Criteria for accepting the task, one sentence each, in order; each must be non-empty
            after trimming. Shown in TASK.md under "Accepted when"; omitted there when empty.
          items:
            type: string
        assignee:
          type: string
          description: A harness id or a person's name. Defaults to the configured harness (claude_code).
        model:
          type: string
          description: >
            Defaults to the configured model (claude-opus-5-5) when the assignee is a harness; must
            be empty for a person.
        manager:
          type: string
          description: The creator's messaging name, who runs the task day to day and may post /accept and /reject <why>.
        owner:
          type: string
          description: >
            The human the task answers to, a messaging name. Defaults to the configured owner; the
            task's manager, not its sandboxes, raises to them what only they can decide.
        for:
          type: string
        notify:
          type: boolean
          default: true
          description: Notify in the panel when the task starts and when it is done (task.yaml `notify:`).
        sandbox:
          $ref: '#/components/schemas/SandboxRequest'
    DeliverTaskRequest:
      type: object
      properties:
        summary:
          type: string
          description: >
            One or two sentences: what was done and where the work is; required, non-empty
            after trimming. The reviewer reads it first.
        report:
          allOf:
            - $ref: '#/components/schemas/DeliveryReport'
          description: >
            Optional. In a request any list and `changes` may be left out; they read as empty
            and absent. 400 when it breaks a rule of ADR 0010 "Delivery report".
        files:
          type: object
          maxProperties: 8
          description: >
            The PNG of each of the report's `shots`, base64, under the shot's label: one per
            shot and no other, each a PNG of at most 2 MB (2097152 bytes); 400 otherwise.
          additionalProperties:
            type: string
            format: byte
      required:
        - summary
    DeliveryReport:
      type: object
      description: >
        What a delivery says against the task's criteria, what the reviewer judges (ADR 0010,
        "Delivery report"). Strings are trimmed; every list holds at most 50 entries. On a task
        the lists are always arrays.
      properties:
        criteria:
          type: array
          maxItems: 50
          description: >
            Exactly one entry per line of the task's `accept`, in the same order; empty when the
            task has none.
          items:
            $ref: '#/components/schemas/DeliveryCriterion'
        changes:
          allOf:
            - $ref: '#/components/schemas/DeliveryChanges'
          nullable: true
          description: Where the work is; optional.
        checks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DeliveryCheck'
        left_out:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DeliveryLeftOut'
        needs:
          type: array
          maxItems: 50
          description: What the agent needs the reviewer to decide; non-empty strings.
          items:
            type: string
            minLength: 1
        shots:
          type: array
          maxItems: 8
          description: >
            Screenshots of what the change looks like, `before` and `after` for a change a person
            sees; absent when the delivery has none. Labels are unique.
          items:
            $ref: '#/components/schemas/DeliveryShot'
      required:
        - criteria
        - changes
        - checks
        - left_out
        - needs
    DeliveryShot:
      type: object
      properties:
        label:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: A slug, `before` or `after` for a UI change.
        file:
          type: string
          description: >
            In a request, the PNG's path where the agent took it (ends in .png); on a task,
            `<label>.png`, the name agc keeps it under.
        url:
          type: string
          description: >
            Set by agc on a task, never sent: where the shot is served, under `AGC_PUBLIC_URL`
            when agc has one, else the root-relative path /api/tasks/<task>/shots/<label>.png.
      required:
        - label
        - file
    DeliveryCriterion:
      type: object
      properties:
        met:
          type: string
          enum: ['yes', 'no', 'partly']
        note:
          type: string
          maxLength: 500
          description: How the agent knows; may be empty.
      required:
        - met
        - note
    DeliveryChanges:
      type: object
      properties:
        branch:
          type: string
          minLength: 1
        sha:
          type: string
          pattern: '^[0-9a-fA-F]{7,40}$'
        files:
          type: integer
          minimum: 0
          nullable: true
          description: How many files changed; null when not given.
      required:
        - branch
        - sha
        - files
    DeliveryCheck:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        passed:
          type: boolean
        note:
          type: string
          maxLength: 500
      required:
        - name
        - passed
        - note
    DeliveryLeftOut:
      type: object
      properties:
        what:
          type: string
          minLength: 1
        why:
          type: string
          minLength: 1
      required:
        - what
        - why
    AcceptTaskRequest:
      type: object
      properties:
        by:
          type: string
          description: Messaging name of who accepts. Defaults to the task's owner; 400 when it has none.
    RejectTaskRequest:
      type: object
      properties:
        by:
          type: string
          description: Messaging name of who rejects. Defaults to the task's owner; 400 when it has none.
        why:
          type: string
          description: Why the task goes back; required, non-empty after trimming.
      required:
        - why
    SandboxRequest:
      description: The environment fields inline, plus the command the sandbox runs for the task.
      allOf:
        - $ref: '#/components/schemas/TaskSpec'
        - type: object
          properties:
            command:
              type: string
              description: >
                Started as the first terminal once booted, split on whitespace, in the repo (or
                /home/agent without one). Empty runs the agent loop (agc agent run) when the
                task's assignee is a harness, and nothing for a person.
    Sandbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: The zero uuid for an agent's home.
        task:
          type: string
          description: The task's name; empty for an agent's home (ADR 0016).
        agent:
          type: string
          description: >
            The name of the persistent agent whose home this is (ADR 0016), kept in step when the
            agent is renamed; empty for a task's sandbox.
        name:
          type: string
          description: >
            The runtime's sandbox name, also its socket file. <task>, then <task>-2, <task>-3; an
            agent's home is named after the agent the same way and keeps its name when the agent
            is renamed.
        spec:
          $ref: '#/components/schemas/TaskSpec'
        disk:
          type: string
          description: >
            The size of the sandbox's private /home/agent disk, the spec's disk or the default 20G,
            such as 20G or 512M.
        disk_mib:
          type: integer
          format: int64
          description: The same size in MiB, to sum across sandboxes.
        command:
          type: string
        instructions:
          type: string
          description: >
            The TASK.md written into the sandbox at /home/agent/TASK.md, byte for byte (ADR 0009);
            for an agent's home, its template's instructions, written as /home/agent/AGENT.md.
        volume:
          type: string
          description: >
            The named volume agc-<name> holding the harness homes (~/.claude, ~/.codex) and their
            transcripts, mounted at /home/agent/.harness and kept after the sandbox is deleted.
            Empty for sandboxes booted before volumes.
        status:
          type: string
          description: >
            starting until booted, failed when the boot failed (status_error says why), otherwise
            the runtime's word verbatim (running, stopped), or unknown when the runtime cannot be
            asked (status_error says why). In a sandbox.status event, deleted once it is gone.
        status_error:
          type: string
          description: Why the status is failed or unknown.
        booted_at:
          type: string
          format: date-time
          nullable: true
        stopped_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        work:
          description: >
            What stopping or deleting the sandbox would lose (ADR 0008 item 6), read live from its
            clone. Set by GET /sandboxes/{id} and by the list with work=1 when the sandbox is
            running and has a repo; null otherwise, and null when the check failed.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SandboxWork'
      required:
        - id
        - task_id
        - task
        - agent
        - name
        - spec
        - disk
        - disk_mib
        - command
        - instructions
        - volume
        - status
        - booted_at
        - stopped_at
        - created_at
        - work
    ChannelMessage:
      type: object
      description: A message in a channel, as /api/msg returns it (ADR 0005).
      properties:
        id:
          type: integer
          format: int64
          description: Also the read cursor; ids are global and totally ordered across channels.
        channel:
          type: string
        from:
          type: string
        participant_id:
          type: string
        task:
          type: string
          description: The poster's task; empty for a human and for agc.
        agent:
          type: string
          description: >
            The home sandbox of the persistent agent that posted (ADR 0016), its first name;
            empty for everyone else.
        human:
          type: boolean
        reply_to:
          type: integer
          format: int64
        body:
          type: string
        images:
          type: array
          description: The images the message carries (ADR 0005 "Images"); absent for a text-only message.
          items:
            $ref: '#/components/schemas/MsgImage'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - channel
        - from
        - participant_id
        - task
        - agent
        - human
        - body
        - created_at
    TaskCreatedEvent:
      type: object
      description: Data of `task.created`.
      properties:
        task:
          $ref: '#/components/schemas/Task'
      required:
        - task
    AgentStateEvent:
      type: object
      description: Data of `agent.state`.
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
      required:
        - agent
    ChannelArchivedEvent:
      type: object
      description: Data of `channel.archived`.
      properties:
        channel:
          type: string
          example: '#fix-login'
        archived_at:
          type: string
          format: date-time
      required:
        - channel
        - archived_at
    ScheduleRanEvent:
      type: object
      description: Data of `schedule.ran`.
      properties:
        schedule:
          $ref: '#/components/schemas/Schedule'
        created:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
        - schedule
        - created
    TaskDoneEvent:
      type: object
      description: Data of `task.done`.
      properties:
        task:
          $ref: '#/components/schemas/Task'
        summary:
          type: string
          description: >
            The task's `summary` when it is delivered; otherwise the body of the last message in
            #<task> from neither a human nor agc (`/accept` and `/reject` commands skipped). Cut to
            500 characters; empty when there is none.
      required:
        - task
        - summary
    SandboxStatusEvent:
      type: object
      description: Data of `sandbox.status`; status is `deleted` once the sandbox is gone.
      properties:
        sandbox:
          $ref: '#/components/schemas/Sandbox'
