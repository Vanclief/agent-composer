openapi: 3.0.3
info:
  title: Agent Composer REST API
  version: 0.1.0
  description: >
    REST interface exposed by the Agent Composer service. The routes documented here were
    generated directly from the Echo handlers in `interfaces/rest/handler` and cover agent
    specs, agent conversations, and runtime hooks. All responses are JSON encoded and share a
    common error envelope.
servers:
  - url: http://localhost:1202/api
    description: Local development server
  - url: /api
    description: Relative base path when the service is deployed behind another host
tags:
  - name: Agent Specs
    description: CRUD operations for reusable agent definitions.
  - name: Conversations
    description: Manage agent conversation runs and forks.
  - name: Hooks
    description: Manage runtime hooks that trigger external commands.
  - name: Workflows
    description: Inspect installed workflows.
  - name: Tasks
    description: >
      Tasks are microsandbox VMs agents work in (ADR 0003). Status is read live from the
      runtime and passed through verbatim.
  - name: Knowledge
    description: >
      Evidence, beliefs, decisions and rules (ADR 0006), read only. Labels are computed on every
      request and never stored; checks are never run.
paths:
  /agents/specs:
    get:
      tags: [Agent Specs]
      operationId: listAgentSpecs
      summary: List agent specs
      description: >
        Returns the newest agent specs first. Results are cursor paginated and can be filtered by
        an optional case-insensitive search over the spec name and by `harness`.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: harness
          in: query
          schema:
            $ref: '#/components/schemas/Harness'
          description: Only return specs using the specified harness.
      responses:
        '200':
          description: Cursor-paginated agent specs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpecListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Agent Specs]
      operationId: createAgentSpec
      summary: Create an agent spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentSpecRequest'
      responses:
        '200':
          description: The newly created agent spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpec'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/specs/{id}:
    get:
      tags: [Agent Specs]
      operationId: getAgentSpec
      summary: Retrieve an agent spec
      parameters:
        - $ref: '#/components/parameters/AgentSpecIdParam'
      responses:
        '200':
          description: The requested agent spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Agent Specs]
      operationId: updateAgentSpec
      summary: Update an agent spec
      parameters:
        - $ref: '#/components/parameters/AgentSpecIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentSpecRequest'
      responses:
        '200':
          description: The updated agent spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Agent Specs]
      operationId: deleteAgentSpec
      summary: Delete an agent spec
      parameters:
        - $ref: '#/components/parameters/AgentSpecIdParam'
      responses:
        '200':
          description: UUID of the deleted spec.
          content:
            application/json:
              schema:
                type: string
                format: uuid
                description: Identifier that was deleted.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversations
      description: >
        Returns the newest conversations first. `search` matches agent names, `agent_spec_id`
        filters to a single spec, `harness` filters by harness type, `status` filters the
        conversation lifecycle state, and `session_id` restricts results to a client session.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring applied to `agent_name`.
        - name: harness
          in: query
          schema:
            $ref: '#/components/schemas/Harness'
          description: Only return conversations using the specified harness.
        - name: agent_spec_id
          in: query
          schema:
            type: string
            format: uuid
          description: Limit results to a single agent spec.
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConversationStatus'
          description: Filter by the most recent conversation status.
        - name: session_id
          in: query
          schema:
            type: string
          description: Filter by a client-provided session identifier.
      responses:
        '200':
          description: Cursor-paginated conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Start one or more conversations
      description: >
        Starts one or more harness-backed conversations from an agent spec. If the targeted spec
        still relies on unsupported legacy runtime options such as hooks, automatic compaction,
        structured outputs, or top-level web search flags, the service returns EINVALID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: Identifiers of the enqueued conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreateResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations/{id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Retrieve a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      responses:
        '200':
          description: The requested conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Conversations]
      operationId: updateConversation
      summary: Update a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: The updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      responses:
        '200':
          description: UUID of the deleted conversation.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations/{id}/fork:
    post:
      tags: [Conversations]
      operationId: forkConversation
      summary: Fork a conversation
      description: >
        Clones the specified conversation, then immediately continues it with a new prompt,
        returning the identifier of the fork. Forked conversations start a fresh harness session
        and do not inherit the prior run's `harness_session_ref`.
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkConversationRequest'
      responses:
        '200':
          description: UUID of the newly created fork.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /agents/conversations/{id}/resume:
    post:
      tags: [Conversations]
      operationId: resumeConversation
      summary: Resume a conversation
      description: >
        Enqueues more model work on the same conversation with a new prompt and returns its
        identifier (which matches the path parameter). For harnesses that support resume, such as
        `codex_cli` and `claude_code`, the service resumes the stored `harness_session_ref` when
        one is available.
      parameters:
        - $ref: '#/components/parameters/ConversationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeConversationRequest'
      responses:
        '200':
          description: UUID of the resumed conversation.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /hooks:
    get:
      tags: [Hooks]
      operationId: listHooks
      summary: List hooks
      description: >
        Returns hooks ordered by cursor. `search` matches the agent name or command, `event_type`
        narrows down to a hook category, and `agent_name` filters to hooks bound to one agent.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring applied to agent names and commands.
        - name: event_type
          in: query
          schema:
            $ref: '#/components/schemas/HookEventType'
          description: Only return hooks that fire on this event type.
        - name: agent_name
          in: query
          schema:
            type: string
          description: Filter hooks that target a specific agent name (empty value is treated as wildcard).
      responses:
        '200':
          description: Cursor-paginated hooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Hooks]
      operationId: createHook
      summary: Create a hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHookRequest'
      responses:
        '200':
          description: The newly created hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /hooks/{id}:
    get:
      tags: [Hooks]
      operationId: getHook
      summary: Retrieve a hook
      parameters:
        - $ref: '#/components/parameters/HookIdParam'
      responses:
        '200':
          description: The requested hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Hooks]
      operationId: updateHook
      summary: Update a hook
      parameters:
        - $ref: '#/components/parameters/HookIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHookRequest'
      responses:
        '200':
          description: The updated hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Hooks]
      operationId: deleteHook
      summary: Delete a hook
      parameters:
        - $ref: '#/components/parameters/HookIdParam'
      responses:
        '200':
          description: UUID of the deleted hook.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /workflows:
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: List workflows
      description: Returns installed workflows from the registry.
      responses:
        '200':
          description: Installed workflow summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '500':
          $ref: '#/components/responses/Error'
  /workflows/{slug}:
    get:
      tags: [Workflows]
      operationId: getWorkflow
      summary: Retrieve a workflow spec
      description: Returns the raw YAML spec for an installed workflow.
      parameters:
        - $ref: '#/components/parameters/WorkflowSlugParam'
      responses:
        '200':
          description: Raw workflow spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowGetResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks
      description: Returns every task, newest first, each with its live status.
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                required:
                  - tasks
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: >
        Creates and boots the sandbox, clones the repo and runs setup. If clone or setup fails
        the sandbox is removed and the error says so. Missing secrets fail before anything is
        created, naming the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Retrieve a task
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The task with its live status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: >
        Stops the sandbox if needed and removes it with its disk and uncommitted work. Volumes
        and the task's channel history are kept.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The deleted task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTaskResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}/stop:
    post:
      tags: [Tasks]
      operationId: stopTask
      summary: Stop a task
      description: Shuts the sandbox down and keeps its disk. The status becomes `stopped`.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The task with its live status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tasks/{id}/start:
    post:
      tags: [Tasks]
      operationId: startTask
      summary: Start a stopped task
      description: Boots the sandbox from its disk with secrets read again from the secrets file.
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: The task with its live status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /specs:
    get:
      tags: [Tasks]
      operationId: listSavedSpecs
      summary: List saved specs
      description: >
        Saved specs are reusable task.yaml files in ~/.agent_composer/config/specs/<name>.yaml,
        sorted by name.
      responses:
        '200':
          description: Saved specs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  specs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedSpec'
                required:
                  - specs
        '500':
          $ref: '#/components/responses/Error'
  /specs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Saved spec name.
        schema:
          type: string
    get:
      tags: [Tasks]
      operationId: getSavedSpec
      summary: Retrieve a saved spec
      responses:
        '200':
          description: The saved spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Tasks]
      operationId: saveSpec
      summary: Save a spec
      description: >
        Validates the YAML as a task.yaml and stores it verbatim, comments included, replacing a
        saved spec of the same name. The name may be free text; it is saved as its slug
        ("Backend review" becomes backend-review), which the response returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - yaml
              properties:
                yaml:
                  type: string
                  description: The task.yaml text.
      responses:
        '200':
          description: The saved spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSpec'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Tasks]
      operationId: deleteSavedSpec
      summary: Delete a saved spec
      responses:
        '200':
          description: The deleted spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSpec'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /secrets:
    get:
      tags: [Tasks]
      operationId: listSecrets
      summary: List secret names
      description: >
        Names in ~/.agent_composer/config/secrets.env, sorted, each with the hosts it is bound to
        by default (empty for names agc does not know, which a spec must bind as NAME@host).
        Values are never returned (ADR 0004). A missing file lists nothing; a file readable by
        anyone but its owner is refused.
      responses:
        '200':
          description: Secret names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Secret'
                required:
                  - secrets
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge:
    get:
      tags: [Knowledge]
      operationId: listKnowledge
      summary: List evidence, beliefs, decisions, rules and actions
      description: >
        Loads evidence/, beliefs/, decisions/, rules/ and actions/ under the knowledge directory
        (~/.agent_composer/knowledge, or AGC_KNOWLEDGE_DIR) on every request, so edits show
        live. A missing directory lists nothing. A file that does not validate is a 400 whose
        message is the validation error, naming the file and the id.
      parameters:
        - name: without
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated evidence and belief ids. Everything is judged as if those were
            retracted or absent (a what-if; nothing is written), and the ids are echoed in
            `without`. An id that is not loaded evidence or a belief is a 404.
      responses:
        '200':
          description: Everything in the knowledge directory, in load order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge/why/{id}:
    get:
      tags: [Knowledge]
      operationId: knowledgeWhy
      summary: Follow a belief, decision, rule or action down to its evidence
      parameters:
        - $ref: '#/components/parameters/KnowledgeIdParam'
      responses:
        '200':
          description: >
            The node, the evidence it cites, what it rests on and its alternative sets of
            reasons, each a tree of Reasons down to the evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reason'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge/doubt/{id}:
    get:
      tags: [Knowledge]
      operationId: knowledgeDoubt
      summary: List what rests on a belief, decision, rule or piece of evidence
      description: >
        Everything that falls if the belief, decision, rule or evidence is wrong, directly or
        through other beliefs and decisions, and apart, in `standing`, what rests on it but
        still stands on another set of reasons. Only open actions are listed. Nothing rests on
        a rule, so its listing is empty. Nothing is changed.
      parameters:
        - $ref: '#/components/parameters/KnowledgeIdParam'
      responses:
        '200':
          description: What rests on the id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doubted'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /knowledge/conflicts:
    get:
      tags: [Knowledge]
      operationId: knowledgeConflicts
      summary: List contested contradictions
      description: >
        Every contradiction where at least one side is contested, in the order declared, with
        the live evidence and opinions each side rests on. No side is picked.
      responses:
        '200':
          description: The contested contradictions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeConflictSet'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  parameters:
    LimitParam:
      name: limit
      in: query
      description: >
        Maximum number of records to return. Defaults to 50 and is capped at 1000 by the service.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    CursorParam:
      name: cursor
      in: query
      description: >
        Base64 encoded cursor returned by a previous page. Supply it to fetch the next page.
      schema:
        type: string
    SearchParam:
      name: search
      in: query
      description: Case-insensitive substring search applied to resource-specific fields.
      schema:
        type: string
    AgentSpecIdParam:
      name: id
      in: path
      required: true
      description: Agent spec identifier.
      schema:
        type: string
        format: uuid
    ConversationIdParam:
      name: id
      in: path
      required: true
      description: Conversation identifier.
      schema:
        type: string
        format: uuid
    HookIdParam:
      name: id
      in: path
      required: true
      description: Hook identifier.
      schema:
        type: string
        format: uuid
    WorkflowSlugParam:
      name: slug
      in: path
      required: true
      description: Workflow slug — the human-facing handle from the registry.
      schema:
        type: string
    TaskIdParam:
      name: id
      in: path
      required: true
      description: Task UUID or task name. A value that parses as a UUID is looked up by id.
      schema:
        type: string
    KnowledgeIdParam:
      name: id
      in: path
      required: true
      description: >
        A belief, decision, rule or action id for why; a belief, decision, rule or evidence id
        for doubt.
      schema:
        type: string
  responses:
    Error:
      description: Error response with machine-readable code and request identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/StandardError'
      required:
        - error
    StandardError:
      type: object
      properties:
        code:
          type: string
          description: Application error code (e.g., EINVALID, ENOTFOUND).
        message:
          type: string
          description: Human-readable error message.
        request_id:
          type: string
          description: Correlation identifier logged by the server.
      required:
        - code
        - message
        - request_id
    CursorPage:
      type: object
      properties:
        next_cursor:
          type: string
          description: Cursor to fetch the next page, omitted if there is no next page.
        has_next_page:
          type: boolean
          description: Indicates whether another page exists.
        hash:
          type: string
          description: SHA-256 hash of the returned items for cache validation.
      required:
        - has_next_page
    AgentSpec:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        harness:
          $ref: '#/components/schemas/Harness'
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffort'
        instructions:
          type: string
        auto_compact:
          type: boolean
        compact_at_percent:
          type: integer
          minimum: 1
          maximum: 100
        compaction_prompt:
          type: string
        shell_access:
          type: boolean
        web_search:
          type: boolean
        structured_output:
          type: boolean
        structured_output_schema:
          type: object
          additionalProperties: true
          nullable: true
        version:
          type: integer
      required:
        - id
        - name
        - harness
        - model
        - reasoning_effort
        - instructions
        - auto_compact
        - compact_at_percent
        - shell_access
        - web_search
        - structured_output
        - version
    AgentSpecListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            agent_specs:
              type: array
              items:
                $ref: '#/components/schemas/AgentSpec'
          required:
            - agent_specs
    CreateAgentSpecRequest:
      type: object
      required:
        - name
        - harness
        - model
        - instructions
      properties:
        name:
          type: string
        harness:
          $ref: '#/components/schemas/Harness'
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
          description: >
            Harness-specific configuration. The access tier is set with the shared
            `permissions` field (`read_only` default, `exec`, or `dangerously-exec`) and works
            the same for every harness. For `codex_cli` other fields may include `profile`,
            `skip_git_repo_check`, `ephemeral`, `add_dirs`, and `config_overrides`. For
            `claude_code` other fields may include `allowed_tools`, `disallowed_tools`,
            `add_dirs`, `mcp_config`, `tools`, `settings`, `system_prompt`,
            `append_system_prompt`, `verbose`, and `strict_mcp_config`. Claude Code workflow
            agents always run with `--bare`; this behavior cannot be disabled through harness
            configuration.
        instructions:
          type: string
      description: >
        Creates a harness-backed agent spec. Legacy provider/self-harness request fields are no
        longer part of this contract.
    UpdateAgentSpecRequest:
      type: object
      properties:
        agent_spec_id:
          type: string
          format: uuid
          readOnly: true
          description: Filled from the path parameter; omit in the payload.
        harness:
          $ref: '#/components/schemas/Harness'
        name:
          type: string
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
        instructions:
          type: string
      description: >
        Supply at least one mutable field; otherwise the service returns EINVALID. Legacy
        provider/self-harness fields are no longer part of this contract.
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_spec_id:
          type: string
          format: uuid
        session_id:
          type: string
          nullable: true
        project_dir:
          type: string
          nullable: true
          description: Optional project directory for the harness process.
        agent_name:
          type: string
        harness:
          $ref: '#/components/schemas/Harness'
        model:
          type: string
        harness_config:
          $ref: '#/components/schemas/JSONValue'
        harness_session_ref:
          type: string
          nullable: true
          description: Harness-native session or thread identifier used for resume.
        harness_state:
          $ref: '#/components/schemas/JSONValue'
        raw_harness_output:
          type: string
          description: Raw machine-readable output captured from the harness, if available.
        harness_exit_code:
          type: integer
          description: Most recent harness process exit code.
        harness_error:
          type: string
          nullable: true
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffort'
        instructions:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        status:
          $ref: '#/components/schemas/ConversationStatus'
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_tokens:
          type: integer
        cost:
          type: integer
          description: Tracked cost in the smallest billing unit known to the service.
        created_at:
          type: string
          format: date-time
        auto_compact:
          type: boolean
        compact_at_percent:
          type: integer
        compaction_prompt:
          type: string
        compact_count:
          type: integer
        shell_access:
          type: boolean
        web_search:
          type: boolean
        structured_output:
          type: boolean
        structured_output_schema:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - id
        - agent_spec_id
        - agent_name
        - harness
        - model
        - harness_exit_code
        - reasoning_effort
        - instructions
        - messages
        - status
        - input_tokens
        - output_tokens
        - cached_tokens
        - cost
        - created_at
        - auto_compact
        - compact_at_percent
        - compact_count
        - shell_access
        - web_search
        - structured_output
    Message:
      type: object
      properties:
        Role:
          $ref: '#/components/schemas/MessageRole'
        Content:
          type: string
        Name:
          type: string
        ToolCallID:
          type: string
        ToolCall:
          $ref: '#/components/schemas/ToolCall'
          nullable: true
    ToolCall:
      type: object
      properties:
        Name:
          type: string
        CallID:
          type: string
        Arguments:
          type: string
          description: Raw JSON arguments returned by the model.
        JSONArguments:
          $ref: '#/components/schemas/JSONValue'
          description: Raw JSON value mirrored from `Arguments` (object, array, or scalar).
      additionalProperties: false
    ConversationListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            conversations:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'
          required:
            - conversations
    CreateConversationRequest:
      type: object
      required:
        - agent_spec_id
        - prompt
      properties:
        agent_spec_id:
          type: string
          format: uuid
        prompt:
          type: string
        parallel_conversations:
          type: integer
          minimum: 1
          default: 1
          description: Number of conversation instances to launch in parallel. Values <1 default to 1.
        session_id:
          type: string
          description: Optional client-provided identifier for logical sessions.
        project_dir:
          type: string
          nullable: true
          description: Optional project directory for the harness process.
        metadata:
          type: object
          additionalProperties: true
          nullable: true
    UpdateConversationRequest:
      type: object
      required:
        - metadata
      properties:
        metadata:
          type: object
          additionalProperties: true
          nullable: false
          description: JSON object to replace metadata; send {} to clear.
    ConversationCreateResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
            required:
              - id
      required:
        - conversations
    ForkConversationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: Prompt to send to the forked conversation.
    ResumeConversationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: Prompt to resume the conversation with.
    Hook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/HookEventType'
        agent_name:
          type: string
          description: Empty string represents a wildcard hook.
        command:
          type: string
        args:
          type: array
          items:
            type: string
        enabled:
          type: boolean
      required:
        - id
        - event_type
        - agent_name
        - command
        - args
        - enabled
    HookListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            hooks:
              type: array
              items:
                $ref: '#/components/schemas/Hook'
          required:
            - hooks
    WorkflowSummary:
      type: object
      properties:
        slug:
          type: string
          description: Human-facing handle — renameable.
        id:
          type: string
          format: uuid
          description: Permanent workflow identity.
        name:
          type: string
        version:
          type: string
        description:
          type: string
        has_draft:
          type: boolean
        draft_only:
          type: boolean
        inputs:
          type: object
          additionalProperties:
            type: string
        outputs:
          type: object
          additionalProperties:
            type: string
      required:
        - slug
        - name
        - inputs
        - outputs
    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSummary'
      required:
        - workflows
    WorkflowGetResponse:
      type: object
      properties:
        workflow_slug:
          type: string
        spec:
          type: string
          description: Raw workflow YAML spec.
        draft:
          type: string
          description: Unsaved proposed spec, when one exists.
      required:
        - workflow_slug
        - spec
    TaskSpec:
      type: object
      description: The task.yaml spec. Secrets are names only, never values.
      properties:
        image:
          type: string
          description: OCI image, default agc-agent.
        cpus:
          type: integer
        memory:
          type: integer
          description: MiB.
        repo:
          type: string
          description: host/owner/name or an https URL, cloned to /home/agent/<name>.
        ref:
          type: string
          description: Branch, tag or commit checked out after the clone.
        setup:
          type: string
          description: Bash script run once after the clone, in the repo.
        secrets:
          type: array
          items:
            type: string
          description: NAME or NAME@host1,host2.
        env:
          type: object
          additionalProperties:
            type: string
        volumes:
          type: array
          items:
            type: string
          description: NAME:DEST[:rw] or host:PATH:DEST[:rw].
        channels:
          type: array
          items:
            type: string
          description: '#name or #name:read.'
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: What a human calls the task.
        name:
          type: string
          description: Slug, also the sandbox name, the task's channel and its socket file.
        spec:
          $ref: '#/components/schemas/TaskSpec'
        status:
          type: string
          description: >
            The runtime's status word, verbatim (for example running or stopped), or unknown when
            the runtime cannot be asked.
        status_error:
          type: string
          description: Why the status is unknown.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - name
        - spec
        - status
        - created_at
        - updated_at
    CreateTaskRequest:
      type: object
      description: At least one of title or name is required.
      required:
        - spec
      properties:
        title:
          type: string
          description: Up to 120 characters. Defaults to the name.
        name:
          type: string
          description: >
            1-63 lowercase letters, digits or -, starting with a letter, and not a UUID. Defaults
            to the title's slug ("Review facebook ads" becomes review-facebook-ads).
        spec:
          $ref: '#/components/schemas/TaskSpec'
    SavedSpec:
      type: object
      properties:
        name:
          type: string
        yaml:
          type: string
          description: The task.yaml text, verbatim.
      required:
        - name
        - yaml
    Secret:
      type: object
      properties:
        name:
          type: string
        hosts:
          type: array
          description: Hosts the secret is bound to by default; empty when agc knows none.
          items:
            type: string
      required:
        - name
        - hosts
    KnowledgeLabel:
      type: string
      description: >
        How what a belief, decision, rule or action rests on is grounded: grounded (live evidence
        under every leaf of some set of reasons), judgment (a leaf with no evidence that comes
        from a person's experience; wins over grounded), opinion (a leaf with no evidence and no
        experience; wins over judgment), in_doubt (a leaf whose evidence is all retracted or set
        aside; wins over the others) or contested (beliefs only: something grounded contradicts
        it or its evidence; wins over opinion).
      enum:
        - grounded
        - judgment
        - opinion
        - in_doubt
        - contested
    Retraction:
      type: object
      properties:
        who:
          type: string
        when:
          type: string
        why:
          type: string
      required:
        - who
        - when
        - why
    KnowledgeSet:
      type: object
      properties:
        dir:
          type: string
          description: The knowledge directory loaded.
        without:
          type: array
          description: The ids set aside with ?without=, [] normally.
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/Belief'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeAction'
      required:
        - dir
        - without
        - evidence
        - beliefs
        - decisions
        - rules
        - actions
    Evidence:
      type: object
      description: Something seen. Retracted evidence stays in its file but grounds nothing.
      properties:
        id:
          type: string
        text:
          type: string
        who:
          type: string
        when:
          type: string
        source:
          type: string
          description: A URL, a file path or a command whose output was seen; empty when unset.
        translated_by:
          type: string
          description: The model that wrote the record from the source; empty when none did.
        retracted:
          allOf:
            - $ref: '#/components/schemas/Retraction'
          nullable: true
        contradicts:
          type: array
          description: Ids of the beliefs and evidence this evidence says it contradicts.
          items:
            type: string
        cited_by:
          type: array
          description: Ids of the beliefs citing this evidence.
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - who
        - when
        - source
        - translated_by
        - retracted
        - contradicts
        - cited_by
        - file
    Belief:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs this one rests on.
          items:
            type: string
        evidence:
          type: array
          description: Ids of the evidence this belief cites.
          items:
            type: string
        or:
          type: array
          description: >
            Alternative sets of reasons, each the ids of its beliefs then its evidence; the
            belief is grounded if its own set or any of these is. [] when none.
          items:
            type: array
            items:
              type: string
        experience:
          type: object
          nullable: true
          description: >
            Whose experience, and in what, a leaf belief comes from, which makes it a judgment;
            null when absent.
          properties:
            of:
              type: string
            in:
              type: string
          required:
            - of
            - in
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          description: Leaf beliefs with no evidence.
          items:
            type: string
        doubted:
          type: array
          description: Leaf beliefs whose evidence is all retracted.
          items:
            type: string
        retracted:
          type: array
          description: The retracted evidence of the doubted leaves.
          items:
            type: string
        contested_by:
          type: array
          description: >
            The grounded beliefs and live evidence contradicting this belief or the evidence it
            cites, when it is contested.
          items:
            type: string
        file:
          type: string
        by:
          type: string
          description: >
            Who holds or stated the belief, a person or an agent; empty for the repo owner.
            Never grounds it: an agent's verdict recorded by agc rules judge is an opinion.
        when:
          type: string
          description: When by held or stated it; empty when unset.
      required:
        - id
        - text
        - because
        - evidence
        - or
        - experience
        - label
        - opinions
        - doubted
        - retracted
        - contested_by
        - file
        - by
        - when
    Decision:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs and decisions this one rests on.
          items:
            type: string
        adr:
          type: string
          description: Path of the ADR; empty when unset.
        decided:
          type: object
          properties:
            who:
              type: string
            when:
              type: string
          required:
            - who
            - when
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - because
        - adr
        - decided
        - label
        - opinions
        - doubted
        - file
    Rule:
      type: object
      properties:
        subject:
          type: string
          description: The subject of the ruleset the rule is in.
        id:
          type: string
        text:
          type: string
        check:
          type: string
          description: Shell command whose exit status says whether the rule holds; never run by the API.
        because:
          type: array
          items:
            type: string
        kind:
          type: string
          description: >
            mechanical when the rule has a check (it may also be judged), judged when it has
            only a judge block, manual when it has neither.
          enum:
            - mechanical
            - judged
            - manual
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
        trusted:
          type: array
          description: >
            Who is trusted to judge the rule (agc rules judge): harness ids or people. [] when
            the rule has no judge block.
          items:
            type: string
        ask:
          type: string
          description: The question put to a judge; empty means the rule text.
      required:
        - subject
        - id
        - text
        - check
        - because
        - kind
        - label
        - opinions
        - doubted
        - file
        - trusted
        - ask
    Reason:
      type: object
      description: >
        A belief, decision, rule or action, the evidence it cites (beliefs only), what it rests
        on and its alternative sets of reasons, each a Reason. A piece of evidence inside an
        alternative is a Reason of kind evidence, with who, when, translated_by and retracted
        set and nothing under it.
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - belief
            - decision
            - rule
            - action
            - evidence
        text:
          type: string
        who:
          type: string
          description: Kind evidence only.
        when:
          type: string
          description: Kind evidence only.
        translated_by:
          type: string
          description: Kind evidence only; absent when no model wrote the record.
        retracted:
          allOf:
            - $ref: '#/components/schemas/Retraction'
          description: Kind evidence only; absent when live.
        evidence:
          type: array
          description: The evidence the node's own set of reasons cites.
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              who:
                type: string
              when:
                type: string
              translated_by:
                type: string
                description: The model that wrote the record from its source; empty when none did.
              retracted:
                allOf:
                  - $ref: '#/components/schemas/Retraction'
                nullable: true
            required:
              - id
              - text
              - who
              - when
              - translated_by
              - retracted
        because:
          type: array
          description: What the node's own set of reasons rests on.
          items:
            $ref: '#/components/schemas/Reason'
        or:
          type: array
          description: >
            Alternative sets of reasons, each a list of nodes: the beliefs and decisions it rests
            on, then its evidence. [] when none.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Reason'
      required:
        - id
        - kind
        - text
        - evidence
        - because
        - or
    Doubted:
      type: object
      properties:
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/Belief'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        actions:
          type: array
          description: Open actions only.
          items:
            $ref: '#/components/schemas/KnowledgeAction'
        standing:
          $ref: '#/components/schemas/KnowledgeStandingSet'
      required:
        - beliefs
        - decisions
        - rules
        - actions
        - standing
    KnowledgeAction:
      type: object
      description: Something to do because of a decision, with the status of what it rests on.
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the decisions and beliefs this action rests on.
          items:
            type: string
        opened:
          $ref: '#/components/schemas/KnowledgeObservation'
        done:
          allOf:
            - $ref: '#/components/schemas/KnowledgeObservation'
          nullable: true
          description: Null while the action is open.
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - because
        - opened
        - done
        - label
        - opinions
        - doubted
        - file
    KnowledgeObservation:
      type: object
      description: Who did something, and when.
      properties:
        who:
          type: string
        when:
          type: string
      required:
        - who
        - when
    KnowledgeStandingSet:
      type: object
      description: >
        What rests on the doubted id in some sets of its reasons but still stands on another,
        by kind. Only open actions are listed.
      properties:
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeStanding'
      required:
        - beliefs
        - decisions
        - rules
        - actions
    KnowledgeStanding:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        other:
          type: array
          description: The sets of reasons that do not reach the doubted id, each as its ids.
          items:
            type: array
            items:
              type: string
        file:
          type: string
      required:
        - id
        - text
        - other
        - file
    KnowledgeConflictSet:
      type: object
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeConflict'
      required:
        - conflicts
    KnowledgeConflict:
      type: object
      description: >
        A contradiction where at least one side is contested. a_rests_on and b_rests_on are the
        leaves under each side, live evidence then opinions; a piece of evidence rests on itself.
      properties:
        a:
          $ref: '#/components/schemas/KnowledgeConflictSide'
        b:
          $ref: '#/components/schemas/KnowledgeConflictSide'
        a_rests_on:
          type: array
          items:
            type: string
        b_rests_on:
          type: array
          items:
            type: string
      required:
        - a
        - b
        - a_rests_on
        - b_rests_on
    KnowledgeConflictSide:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - belief
            - evidence
        text:
          type: string
      required:
        - id
        - kind
        - text
    DeleteTaskResponse:
      type: object
      properties:
        deleted:
          type: boolean
        name:
          type: string
      required:
        - deleted
        - name
    CreateHookRequest:
      type: object
      required:
        - event_type
        - command
        - enabled
      properties:
        event_type:
          $ref: '#/components/schemas/HookEventType'
        agent_name:
          type: string
          description: Empty string (or omission) registers a wildcard hook.
        command:
          type: string
        args:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    UpdateHookRequest:
      type: object
      properties:
        hook_id:
          type: string
          format: uuid
          readOnly: true
          description: Filled from the path parameter; omit in the payload.
        event_type:
          $ref: '#/components/schemas/HookEventType'
        agent_name:
          type: string
        command:
          type: string
        args:
          type: array
          nullable: true
          items:
            type: string
        enabled:
          type: boolean
      description: Supply at least one mutable field; otherwise the service returns EINVALID.
    Harness:
      type: string
      enum:
        - codex_cli
        - claude_code
    ReasoningEffort:
      type: string
      enum:
        - high
        - medium
        - low
    ConversationStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - canceled
    HookEventType:
      type: string
      enum:
        - conversation_started
        - conversation_ended
        - context_exceeded
        - pre_context_compaction
        - post_context_compaction
        - pre_tool_use
        - post_tool_use
    MessageRole:
      type: string
      enum:
        - system
        - user
        - assistant
        - tool
    JSONValue:
      description: Represents an arbitrary JSON value.
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: integer
        - type: boolean
