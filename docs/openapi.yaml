        - sandbox
    MessagePostedEvent:
      type: object
      description: Data of `message.posted`.
      properties:
        message:
          $ref: '#/components/schemas/ChannelMessage'
      required:
        - message
    TranscriptList:
      type: object
      properties:
        volume:
          type: string
          description: The volume read.
        transcripts:
          type: array
          items:
            $ref: '#/components/schemas/Transcript'
      required:
        - volume
        - transcripts
    Transcript:
      type: object
      properties:
        path:
          type: string
          description: Relative to the volume, which the guest sees at /home/agent/.harness.
        size:
          type: integer
          format: int64
          description: Bytes.
        modified_at:
          type: string
          format: date-time
      required:
        - path
        - size
        - modified_at
    TurnTokens:
      type: object
      nullable: true
      description: Token counts summed over the turn's model calls; null when the transcript has none.
      properties:
        input:
          type: integer
          format: int64
          description: Input tokens not read from the cache.
        output:
          type: integer
          format: int64
        cache_read:
          type: integer
          format: int64
        cache_write:
          type: integer
          format: int64
      required: [input, output, cache_read, cache_write]
    TurnToolCall:
      type: object
      properties:
        name:
          type: string
        args:
          description: The tool's arguments as the model sent them.
        result:
          type: string
          description: The result as text, cut to 4096 bytes.
        truncated:
          type: boolean
        error:
          type: boolean
          description: Set when the harness marked the result as an error.
      required: [name, args, result, truncated]
    TurnSummary:
      type: object
      properties:
        n:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        session:
          type: string
          description: The harness session id.
        harness:
          type: string
          enum: [claude_code, codex_cli]
        channel:
          type: string
          description: From agc-sessions.json, empty when the session is not in it.
        thread:
          type: string
          description: The thread root id, or main; empty when the session is not in agc-sessions.json.
        tool_calls:
          type: integer
          description: How many tools the turn called.
        answer:
          type: string
          description: The first line of the final answer, at most 200 characters.
        tokens:
          $ref: '#/components/schemas/TurnTokens'
      required: [n, started_at, ended_at, session, harness, channel, thread, tool_calls, answer, tokens]
    TurnList:
      type: object
      properties:
        turns:
          type: array
          items:
            $ref: '#/components/schemas/TurnSummary'
        skipped:
          type: integer
          description: Lines of the session files that are not JSON objects, left out.
      required: [turns, skipped]
    Turn:
      type: object
      properties:
        n:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        session:
          type: string
        harness:
          type: string
          enum: [claude_code, codex_cli]
        channel:
          type: string
        thread:
          type: string
        injected:
          type: string
          description: The user message as sent.
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/TurnToolCall'
        answer:
          type: string
          description: The final assistant text.
        tokens:
          $ref: '#/components/schemas/TurnTokens'
      required: [n, started_at, ended_at, session, harness, channel, thread, injected, tool_calls, answer, tokens]
    SandboxWork:
      type: object
      properties:
        dirty:
          type: boolean
          description: The clone has uncommitted changes (git status --porcelain printed a line).
        unpushed:
          type: integer
          description: >
            Commits reachable from HEAD that are on no remote branch (git rev-list --count HEAD
            --not --remotes), with or without an upstream.
        checked_at:
          type: string
          format: date-time
      required:
        - dirty
        - unpushed
        - checked_at
    SandboxGCRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          description: Only list what would be deleted.
        keep:
          type: string
          description: >
            Grace period after the task is done, a Go duration such as 48h, or 0. Empty is the
            configured keep_done, or 24h when keep_done is 0 (the collector off).
    SandboxGCItem:
      type: object
      properties:
        name:
          type: string
        task:
          type: string
        done_for:
          type: string
          description: How long ago the task was done, such as 26h3m0s.
        disk:
          type: string
        disk_mib:
          type: integer
          format: int64
        error:
          type: string
          description: Why the delete failed; absent when it did not.
      required:
        - name
        - task
        - done_for
        - disk
        - disk_mib
    SandboxGCResponse:
      type: object
      properties:
        dry_run:
          type: boolean
        keep:
          type: string
          description: The grace period applied, such as 24h0m0s.
        sandboxes:
          type: array
          description: What was deleted (or, on a dry run, would be), with any failed delete.
          items:
            $ref: '#/components/schemas/SandboxGCItem'
        freed:
          type: integer
          description: How many sandboxes were deleted; 0 on a dry run.
        freed_disk:
          type: string
          description: The disk of the deleted sandboxes, such as 40G.
      required:
        - dry_run
        - keep
        - sandboxes
        - freed
        - freed_disk
    DeleteSandboxResponse:
      type: object
      properties:
        deleted:
          type: boolean
        name:
          type: string
      required:
        - deleted
        - name
    Terminal:
      type: object
      description: One interactive job in a sandbox.
      properties:
        id:
          type: string
        command:
          type: array
          items:
            type: string
        running:
          type: boolean
      required:
        - id
        - command
        - running
    StartTerminalRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          description: Split on whitespace, e.g. "claude --resume".
        dir:
          type: string
          description: Working directory. Empty means the sandbox user's default.
    SavedSpec:
      type: object
      properties:
        name:
          type: string
        yaml:
          type: string
          description: The sandbox spec YAML, verbatim.
      required:
        - name
        - yaml
    HarnessReads:
      type: object
      properties:
        id:
          type: string
          description: Harness id, as in runtime/harnesses/catalog.go (codex_cli, claude_code, pi).
        reads:
          type: array
          description: Variables the harness takes its credentials from, in order of preference; empty when none is fixed.
          items:
            type: string
      required:
        - id
        - reads
    Secret:
      type: object
      properties:
        name:
          type: string
        hosts:
          type: array
          description: Hosts the secret is bound to by default; empty when agc knows none.
          items:
            type: string
      required:
        - name
        - hosts
    KnowledgeLabel:
      type: string
      description: >
        How what a belief, decision, rule or action rests on is grounded: grounded (live evidence
        under every leaf of some set of reasons), judgment (a leaf with no evidence that comes
        from a person's experience; wins over grounded), opinion (a leaf with no evidence and no
        experience; wins over judgment), in_doubt (a leaf whose evidence is all retracted or set
        aside; wins over the others) or contested (beliefs only: something grounded contradicts
        it or its evidence; wins over opinion).
      enum:
        - grounded
        - judgment
        - opinion
        - in_doubt
        - contested
    Retraction:
      type: object
      properties:
        who:
          type: string
        when:
          type: string
        why:
          type: string
      required:
        - who
        - when
        - why
    KnowledgeSet:
      type: object
      properties:
        dir:
          type: string
          description: The knowledge directory loaded.
        without:
          type: array
          description: The ids set aside with ?without=, [] normally.
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/Belief'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeAction'
        proposals:
          type: array
          description: Every proposal with how it stands at the gate now (ADR 0007).
          items:
            $ref: '#/components/schemas/KnowledgeProposal'
        gates:
          type: array
          description: Every gate with the tier it gives now and its counts, ending with the default gate, whose id is empty.
          items:
            $ref: '#/components/schemas/KnowledgeGate'
      required:
        - dir
        - without
        - evidence
        - beliefs
        - decisions
        - rules
        - actions
        - proposals
        - gates
    Evidence:
      type: object
      description: Something seen. Retracted evidence stays in its file but grounds nothing.
      properties:
        id:
          type: string
        text:
          type: string
        who:
          type: string
        when:
          type: string
        source:
          type: string
          description: A URL, a file path or a command whose output was seen; empty when unset.
        translated_by:
          type: string
          description: The model that wrote the record from the source; empty when none did.
        retracted:
          allOf:
            - $ref: '#/components/schemas/Retraction'
          nullable: true
        contradicts:
          type: array
          description: Ids of the beliefs and evidence this evidence says it contradicts.
          items:
            type: string
        cited_by:
          type: array
          description: Ids of the beliefs citing this evidence.
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - who
        - when
        - source
        - translated_by
        - retracted
        - contradicts
        - cited_by
        - file
    Belief:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs this one rests on.
          items:
            type: string
        evidence:
          type: array
          description: Ids of the evidence this belief cites.
          items:
            type: string
        or:
          type: array
          description: >
            Alternative sets of reasons, each the ids of its beliefs then its evidence; the
            belief is grounded if its own set or any of these is. [] when none.
          items:
            type: array
            items:
              type: string
        experience:
          type: object
          nullable: true
          description: >
            Whose experience, and in what, a leaf belief comes from, which makes it a judgment;
            null when absent.
          properties:
            of:
              type: string
            in:
              type: string
          required:
            - of
            - in
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          description: Leaf beliefs with no evidence.
          items:
            type: string
        doubted:
          type: array
          description: Leaf beliefs whose evidence is all retracted.
          items:
            type: string
        retracted:
          type: array
          description: The retracted evidence of the doubted leaves.
          items:
            type: string
        contested_by:
          type: array
          description: >
            The grounded beliefs and live evidence contradicting this belief or the evidence it
            cites, when it is contested.
          items:
            type: string
        file:
          type: string
        by:
          type: string
          description: >
            Who holds or stated the belief, a person or an agent; empty for the repo owner.
            Never grounds it: an agent's verdict recorded by agc rules judge is an opinion.
        when:
          type: string
          description: When by held or stated it; empty when unset.
      required:
        - id
        - text
        - because
        - evidence
        - or
        - experience
        - label
        - opinions
        - doubted
        - retracted
        - contested_by
        - file
        - by
        - when
    Decision:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs and decisions this one rests on.
          items:
            type: string
        adr:
          type: string
          description: Path of the ADR; empty when unset.
        decided:
          type: object
          properties:
            who:
              type: string
            when:
              type: string
          required:
            - who
            - when
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - because
        - adr
        - decided
        - label
        - opinions
        - doubted
        - file
    Rule:
      type: object
      properties:
        subject:
          type: string
          description: The subject of the ruleset the rule is in.
        id:
          type: string
        text:
          type: string
        check:
          type: string
          description: Shell command whose exit status says whether the rule holds; never run by the API.
        because:
          type: array
          items:
            type: string
        kind:
          type: string
          description: >
            mechanical when the rule has a check (it may also be judged), judged when it has
            only a judge block, manual when it has neither.
          enum:
            - mechanical
            - judged
            - manual
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
        trusted:
          type: array
          description: >
            Who is trusted to judge the rule (agc rules judge): harness ids or people. [] when
            the rule has no judge block.
          items:
            type: string
        ask:
          type: string
          description: The question put to a judge; empty means the rule text.
      required:
        - subject
        - id
        - text
        - check
        - because
        - kind
        - label
        - opinions
        - doubted
        - file
        - trusted
        - ask
    Reason:
      type: object
      description: >
        A belief, decision, rule or action, the evidence it cites (beliefs only), what it rests
        on and its alternative sets of reasons, each a Reason. A piece of evidence inside an
        alternative is a Reason of kind evidence, with who, when, translated_by and retracted
        set and nothing under it.
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - belief
            - decision
            - rule
            - action
            - evidence
        text:
          type: string
        who:
          type: string
          description: Kind evidence only.
        when:
          type: string
          description: Kind evidence only.
        translated_by:
          type: string
          description: Kind evidence only; absent when no model wrote the record.
        retracted:
          allOf:
            - $ref: '#/components/schemas/Retraction'
          description: Kind evidence only; absent when live.
        evidence:
          type: array
          description: The evidence the node's own set of reasons cites.
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              who:
                type: string
              when:
                type: string
              translated_by:
                type: string
                description: The model that wrote the record from its source; empty when none did.
              retracted:
                allOf:
                  - $ref: '#/components/schemas/Retraction'
                nullable: true
            required:
              - id
              - text
              - who
              - when
              - translated_by
              - retracted
        because:
          type: array
          description: What the node's own set of reasons rests on.
          items:
            $ref: '#/components/schemas/Reason'
        or:
          type: array
          description: >
            Alternative sets of reasons, each a list of nodes: the beliefs and decisions it rests
            on, then its evidence. [] when none.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Reason'
      required:
        - id
        - kind
        - text
        - evidence
        - because
        - or
    Doubted:
      type: object
      properties:
        beliefs:
          type: array
          items:
            $ref: '#/components/schemas/Belief'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        actions:
          type: array
          description: Open actions only.
          items:
            $ref: '#/components/schemas/KnowledgeAction'
        standing:
          $ref: '#/components/schemas/KnowledgeStandingSet'
      required:
        - beliefs
        - decisions
        - rules
        - actions
        - standing
    KnowledgeAction:
      type: object
      description: Something to do because of a decision, with the status of what it rests on.
      properties:
        id:
          type: string
        text:
          type: string
        because:
          type: array
          description: Ids of the decisions and beliefs this action rests on.
          items:
            type: string
        opened:
          $ref: '#/components/schemas/KnowledgeObservation'
        done:
          allOf:
            - $ref: '#/components/schemas/KnowledgeObservation'
          nullable: true
          description: Null while the action is open.
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - text
        - because
        - opened
        - done
        - label
        - opinions
        - doubted
        - file
    KnowledgeTier:
      type: string
      description: How much of a human a proposal needs before it lands (ADR 0007).
      enum: [decide, observe, delegated]
    KnowledgeProposal:
      type: object
      description: |
        What an agent put forward, with what it rests on and how it stands at the gate now:
        the gate covering it, the tier the gate is written with, the tier it gets and why they
        differ. Computed on every request, never stored.
      properties:
        id:
          type: string
        proposes:
          type: string
          description: What kind of thing is proposed.
          enum: [rule, belief, evidence, decision, action, gate, code]
        text:
          type: string
        because:
          type: array
          description: Ids of the beliefs and decisions the proposal rests on.
          items:
            type: string
        evidence:
          type: array
          description: Ids of the evidence the proposal cites.
          items:
            type: string
        by:
          type: string
          description: Who proposed it, an agent id or a person.
        when:
          type: string
        change:
          type: string
          description: Where the change itself lives (a branch, a commit, a path), or empty.
        became:
          type: string
          description: The id it was recorded under once accepted, or empty.
        accepted:
          allOf:
            - $ref: '#/components/schemas/KnowledgeObservation'
          nullable: true
          description: Null unless accepted.
        rejected:
          allOf:
            - $ref: '#/components/schemas/KnowledgeRejection'
          nullable: true
          description: Null unless rejected.
        gate:
          type: string
          description: Id of the gate covering it, empty when none does and the default applies.
        written:
          $ref: '#/components/schemas/KnowledgeTier'
        tier:
          $ref: '#/components/schemas/KnowledgeTier'
        audited:
          type: boolean
          description: An observe gate sampled this one, so it needs a decision.
        tightened_by:
          type: array
          description: Rejected proposals under the same gate that pulled it to decide.
          items:
            type: string
        illegible:
          type: boolean
          description: It acts and rests on nothing, so there is no why to read; it needs a decision.
        label:
          $ref: '#/components/schemas/KnowledgeLabel'
        opinions:
          type: array
          items:
            type: string
        doubted:
          type: array
          items:
            type: string
        file:
          type: string
      required:
        - id
        - proposes
        - text
        - because
        - evidence
        - by
        - when
        - change
        - became
        - accepted
        - rejected
        - gate
        - written
        - tier
        - audited
        - tightened_by
        - illegible
        - label
        - opinions
        - doubted
        - file
    KnowledgeRejection:
      type: object
      description: Who turned a proposal down, when and why.
      properties:
        who:
          type: string
        when:
          type: string
        why:
          type: string
      required:
        - who
        - when
        - why
    KnowledgeGate:
      type: object
      description: |
        A gate with the tier it gives now and how the proposals under it have gone. The last
        gate in the list has an empty id: the default for proposals no gate covers.
      properties:
        id:
          type: string
        proposes:
          type: string
        by:
          type: array
          description: Proposers covered; empty means anyone.
          items:
            type: string
        written:
          $ref: '#/components/schemas/KnowledgeTier'
        tier:
          $ref: '#/components/schemas/KnowledgeTier'
        sample:
          type: integer
          description: On an observe gate, about one in this many is audited; 0 means none.
        since:
          type: string
          description: Rejections before this day do not tighten the gate; empty counts every one.
        because:
