# What to do because of a decision. An action is open until it has
# done: { who, when }; keep it here once done. `agc actions show` lists the
# open ones first, and `agc beliefs doubt <id>` lists the open ones resting
# on a doubted belief or piece of evidence (ADR 0006). Each comment names
# where the follow-up was written down.
actions:
  # ADR 0006, "Next step".
  - id: attach-rulesets-to-task-specs
    action: Let a task spec name rulesets, beliefs and decisions so agents in its sandbox receive them, for example in the sandbox's AGENTS.md.
    because: [rules-beliefs-and-decisions-as-yaml, tasks-run-in-microsandbox-vms]
    opened: { who: franco, when: 2026-11-01 }

  # .github/workflows/release.yml builds with CGO_ENABLED=0, and
  # executor/sandbox/nocgo.go says the sandbox executor is not in a build
  # without cgo.
  - id: release-builds-with-cgo
    action: Build the release binaries with cgo so Tasks can run sandboxes from a released agc.
    because: [tasks-run-in-microsandbox-vms]
    opened: { who: franco, when: 2026-11-01 }

  # ADR 0003, Consequences: "Workflow nodes need `environment:` to say where
  # they run"; decision 2 embeds the Task spec in a workflow spec under
  # environment:. No workflow spec reads it yet.
  - id: workflow-nodes-name-their-environment
    action: "Let a workflow spec embed a Task spec under `environment:` so its nodes say where they run."
    because: [tasks-run-in-microsandbox-vms]
    opened: { who: franco, when: 2026-11-01 }

  # ADR 0003, Consequences: deleting a Task deletes uncommitted work and
  # keeps its volumes, and "the UI must say both in the delete control
  # itself". panel/src/features/tasks/TaskActions.tsx only asks "Delete?".
  - id: task-delete-says-what-is-lost
    action: Make the panel's Stop and Delete controls for a sandbox (a task's VM before ADR 0008, now a sandbox) say what work in its clone is lost, uncommitted changes and unpushed commits, read live through the sandbox's work field.
    because: [tasks-run-in-microsandbox-vms]
    opened: { who: franco, when: 2026-11-01 }
    done: { who: claude_code, when: 2026-11-02 }

  # ADR 0004, Consequences: .gitignore "must also exclude .agent_composer/".
  # Done in d458f37 (.gitignore lines 52-53).
  - id: gitignore-the-local-data-dir
    action: Exclude .agent_composer/ in .gitignore so a project-local secrets.env never enters git.
    because: [secrets-are-placeholders-bound-to-hosts]
    opened: { who: franco, when: 2026-11-01 }
    done: { who: franco, when: 2026-11-01 }

  # ADR 0010 item 6: the Go side (criteria, deliver, accept, reject) is in;
  # panel/src still posts /tasks/{id}/done, which is gone.
  - id: panel-shows-acceptance
    action: "Make the panel show criteria, review, accept and reject: the Brief tab's checklist, the review chip, Accept and Reject in a reviewed task's actions, and \"Accepted when\" in the New task dialog."
    because: [tasks-are-done-when-accepted]
    opened: { who: franco, when: 2026-11-02 }

  # ADR 0011, Open question: Meta calls a public HTTPS webhook and the rig
  # is LAN-only on 127.0.0.1 (rig-services-bind-localhost).
  - id: whatsapp-inbound-needs-a-reachable-webhook
    action: Choose how Franco's WhatsApp replies reach a @franco/<task> channel, a tunnel to one signed webhook route on the rig or a polled relay outside it, and say how a reply names its task.
    because: [direct-messages-are-human-task-channels]
    opened: { who: claude_code, when: 2026-11-02 }
