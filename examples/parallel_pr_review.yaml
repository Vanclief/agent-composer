workflow:
  id: parallel_pr_review
  name: "Parallel PR Review"
  version: "1"
  description: >
    Run three independent gpt-5.5 agents that each review the current changes
    against the provided branch using the pr-review skill, merge all of their
    issues into a single list, then deduplicate issues that the reviewers
    reported in common.
  inputs:
    branch: string
  outputs:
    issues:
      schema: ReviewIssueList
      from: instance.dedupe_issues.out

schemas:
  ReviewIssue:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      severity:
        type: string
        enum: [low, medium, high]
      location:
        type: string

  ReviewIssueList:
    type: array
    items:
      schema_ref: ReviewIssue

nodes:
  pr_reviewer:
    kind: inference
    inputs:
      branch: string
    outputs:
      out: ReviewIssueList
    config:
      harness:
        id: codex_cli
        model: gpt-5.5
        reasoning_effort: xhigh
      instruction: >
        Run the pr-review skill in read-only mode to review the current changes
        against the provided branch. Do not modify any files. Return every issue
        you find as a structured list of review issues.

  merged_issues:
    kind: connector
    operation: concat
    inputs:
      issues_a: ReviewIssueList
      issues_b: ReviewIssueList
      issues_c: ReviewIssueList
    outputs:
      out: ReviewIssueList

  issue_deduplicator:
    kind: inference
    inputs:
      issues: ReviewIssueList
    outputs:
      out: ReviewIssueList
    config:
      harness:
        id: codex_cli
        model: gpt-5.5
        reasoning_effort: xhigh
      instruction: >
        You are given a list of review issues collected from three independent
        reviewers. Remove duplicates: when two or more issues describe the same
        underlying problem (same root cause and location, even if worded
        differently), keep a single best entry and drop the rest. Do not merge
        distinct issues and do not invent new ones. Return the deduplicated list.

flow:
  instances:
    review_a:
      node: pr_reviewer
      inputs:
        branch: workflow_input.branch

    review_b:
      node: pr_reviewer
      inputs:
        branch: workflow_input.branch

    review_c:
      node: pr_reviewer
      inputs:
        branch: workflow_input.branch

    merge_issues:
      node: merged_issues
      inputs:
        issues_a: instance.review_a.out
        issues_b: instance.review_b.out
        issues_c: instance.review_c.out

    dedupe_issues:
      node: issue_deduplicator
      inputs:
        issues: instance.merge_issues.out
