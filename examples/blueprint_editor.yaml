workflow:
  id: blueprint-editor
  name: "Blueprint Editor"
  version: "1"
  description: >
    Create or edit an installed AGC workflow blueprint from a
    natural-language request. The agent edits the registry through the
    agc CLI and validates with the compiler before installing.
  inputs:
    workflow_id: string
    request: string
  outputs:
    result:
      schema: EditResult
      from: instance.edit.result

schemas:
  EditResult:
    type: object
    properties:
      workflow_id:
        type: string
      action:
        type: string
        enum: [created, updated, unchanged]
      summary:
        type: string

nodes:
  blueprint_editor_agent:
    kind: inference
    inputs:
      workflow_id: string
      request: string
    outputs:
      result: EditResult
    config:
      harness:
        id: claude_code
        model: claude-opus-5
        permissions: exec
      instruction: >
        You maintain the AGC workflow blueprint registry on this
        machine, using the agc CLI as your only interface to it.

        A blueprint is one YAML file with four top-level sections.
        workflow: id, name, version, description, inputs (name: type),
        outputs (name: {schema, from: instance.<id>.<output>}).
        schemas: named types (type object/array/string/integer/number/
        boolean, properties, items, schema_ref, enum). nodes: reusable
        definitions — kinds are inference (typed inputs/outputs plus
        config.harness {id, model, reasoning_effort, permissions} and
        config.instruction), connector (operation: collect | concat |
        pack | unpack), loop (operation: foreach | while, executes:
        <node>, over/updates/breaks_on, max_iterations), conditional
        (operation: if, routes_on, when_true/when_false: <node>), and
        workflow (workflow_id: <id>) for composition. flow.instances:
        instance_id: {node: <node>, inputs: {port:
        workflow_input.<name> | instance.<id>.<output>}}.

        Do this:
        1. Run `agc workflow list` to see what is installed. If
        workflow_id is not empty, read it with
        `agc workflow show --id <workflow_id>`. Read one or two other
        installed blueprints for DSL patterns when unsure.
        2. Write the complete new or updated blueprint to a scratch
        file in your working directory.
        3. Validate it with `agc workflow compile --file <scratch>`.
        Fix and re-compile until it passes.
        4. Install it with
        `agc workflow import --file <scratch> --overwrite`, then
        delete the scratch file.

        Rules: when editing, keep workflow.id unchanged and change
        only what the request asks for — preserve every unrelated
        node, prompt, and schema. For a new workflow pick a short
        kebab-case id that is not already installed. Prefer the fewest
        nodes that satisfy the request, and reuse one node definition
        for parallel instances. If the request is impossible or too
        ambiguous to act on safely, install nothing and explain why in
        the summary.

        Return result with the final workflow_id, action (created for
        a new id, updated when an existing workflow changed, unchanged
        when you installed nothing), and a 1-3 sentence summary.

flow:
  instances:
    edit:
      node: blueprint_editor_agent
      inputs:
        workflow_id: workflow_input.workflow_id
        request: workflow_input.request
